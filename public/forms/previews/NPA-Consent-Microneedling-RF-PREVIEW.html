<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Preview — Microneedling Consent | NPA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap');
:root { --black:#1A1A1A; --pink:#D4537E; --border:#ddd0d5; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;font-size:8pt;background:#e8dde3;color:#1A1A1A;line-height:1.35;padding:12px}
.wrap{max-width:10.5in;margin:0 auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);position:relative;overflow:hidden;border-radius:4px}
.wm{position:absolute;inset:0;z-index:50;pointer-events:none;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(-35deg,transparent,transparent 24px,rgba(212,83,126,.04) 24px,rgba(212,83,126,.04) 25px)}
.wm span{font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,4vw,36px);letter-spacing:.12em;color:rgba(212,83,126,.22);transform:rotate(-18deg);text-transform:uppercase;text-align:center;line-height:1.1;padding:0 8px}
.hdr{display:flex;align-items:center;justify-content:space-between;background:var(--black);color:#fff;padding:8px 12px;border-radius:3px;margin:10px}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:14pt;letter-spacing:2px}
.hdr .sub{font-size:7pt;color:var(--pink);font-weight:700;text-transform:uppercase}
.banner{margin:0 10px 10px;padding:10px;background:linear-gradient(90deg,rgba(212,83,126,.12),transparent);border-left:3px solid var(--pink);font-size:7.5pt}
.banner strong{color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 14px;filter:blur(.4px);opacity:.9}
.card{border:1px solid var(--border);border-radius:3px;padding:8px;font-size:6.5pt;color:#555}
.ch{font-weight:700;color:var(--pink);text-transform:uppercase;font-size:6pt;margin-bottom:4px}
.foot{padding:10px;text-align:center;font-size:6.5pt;color:#888;border-top:1px solid #eee}
.foot a{color:var(--pink);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="wm"><span>Preview · Purchase for full consent</span></div>
  <div class="hdr">
    <div><h1>MICRONEEDLING · RF</h1><div class="sub">Sample — not for clinical use</div></div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:10pt;color:var(--pink);text-align:right">NPA</div>
  </div>
  <div class="banner"><strong>Teaser only.</strong> Paid file includes infection, pigment, series expectations, and aftercare.</div>
  <div class="grid">
    <div class="card"><div class="ch">Risks</div> Erythema, PIH <span style="color:#999">…</span></div>
    <div class="card"><div class="ch">Signatures</div> Patient &amp; provider <span style="color:#999">…</span></div>
  </div>
  <div class="foot">nopriorauthorization.com · <a href="/shop/consent-microneedling-rf">Full form — $19</a></div>
</div>
</body>
</html>
