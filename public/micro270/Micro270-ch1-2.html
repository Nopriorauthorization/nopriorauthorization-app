<script>
const Q=[
{id:1,cat:'v',trap:0,q:'Microbiology is defined as the study of living AND nonliving microscopic entities. What are the nonliving entities?',a:'Viruses, prions, and viroids — they are not considered living because they lack cells, cannot reproduce independently, and do not carry out metabolism on their own.',e:'<b>Viruses are not alive</b> — they require a host cell for replication and have no metabolism of their own. Prions are misfolded proteins. Viroids are small RNA molecules. All are studied in microbiology despite not meeting criteria for life.'},
{id:2,cat:'v',trap:1,q:'TRAP: An opportunistic pathogen is simply a weaker version of a true pathogen. True or false?',a:'FALSE — an opportunistic pathogen is a normally harmless microbe that causes disease ONLY when the host is immunocompromised or normal microbiota is disrupted.',e:'<b>True pathogens cause disease in healthy hosts. Opportunistic pathogens require a compromised host.</b> Example: Candida albicans is normal microbiota but becomes pathogenic when immunity is suppressed (HIV patients, antibiotic use). The distinction is host condition, not pathogen strength.'},
{id:3,cat:'v',trap:0,q:'What was the key difference between Pasteur\'s experiment and those that supported spontaneous generation?',a:'Pasteur used swan-neck flasks — broth was exposed to air but the curved neck prevented microbes from reaching it. When the neck was broken, broth became cloudy. This proved microbes came from air, not spontaneous generation.',e:'Spontaneous generation claimed life arose from nonliving matter. Pasteur\'s elegant design allowed air contact (critics\' requirement) while blocking microbial entry. His results supported biogenesis — life comes only from pre-existing life.'},
{id:4,cat:'v',trap:0,q:'List Koch\'s four postulates in order.',a:'1. Microorganism found in all diseased hosts, not healthy. 2. Microorganism isolated and grown in pure culture. 3. Pure culture causes disease when introduced to healthy host. 4. Microorganism re-isolated from new host and matches original.',e:'Koch\'s postulates established the germ theory of disease — specific microbes cause specific diseases. They are foundational to infectious disease medicine. Limitation: some pathogens cannot be cultured, some cause disease only in humans (cannot test postulate 3 ethically).'},
{id:5,cat:'v',trap:1,q:'TRAP: Aseptic technique means creating a 100% sterile environment. True or false?',a:'FALSE — aseptic means reducing microbial contamination to prevent infection or culture contamination. It does NOT mean 100% sterile.',e:'<b>Sterile = absence of ALL microorganisms. Aseptic = practices that prevent contamination.</b> A surgical suite uses aseptic technique but is not 100% sterile. This distinction matters clinically — sterilization destroys everything; aseptic technique manages contamination risk.'},
{id:6,cat:'v',trap:0,q:'What is normal microbiota and why is disrupting it medically concerning?',a:'Normal microbiota = the community of microorganisms that normally live on/in the body without causing disease. Disruption allows opportunistic pathogens to colonize vacated niches — e.g., C. difficile after antibiotics wipe out gut bacteria.',e:'Normal microbiota compete for space and nutrients, produce antimicrobial substances, and train the immune system. Antibiotics, illness, or stress can disrupt this balance. C. difficile infection after antibiotic use is a classic example of disruption causing disease.'},
{id:7,cat:'v',trap:0,q:'Define parasitism, commensalism, and mutualism.',a:'Parasitism = one organism benefits, host is harmed. Commensalism = one benefits, other is unaffected. Mutualism = both organisms benefit.',e:'Most normal microbiota are commensal (benefit from us, we are unaffected) or mutualistic (gut bacteria produce vitamin K for us). Pathogens are parasites. Understanding these relationships helps explain why some microbes harm us and others help us.'},
{id:8,cat:'v',trap:0,q:'A student notes "a red color developed in the test tube." Is this an observation or conclusion?',a:'OBSERVATION — it is a directly measurable, sensory fact. A conclusion would interpret WHY the color changed (e.g., "the bacterium ferments glucose").',e:'Science distinction: Observations = facts you directly detect. Conclusions = interpretations based on observations. "The solution turned red" = observation. "The organism is gram-positive" = conclusion based on observing the stain result. Knowing this prevents pseudoscientific reasoning.'},
{id:9,cat:'v',trap:1,q:'TRAP: A scientific theory is just a guess or unproven idea. True or false?',a:'FALSE — in science, a theory is a well-substantiated explanation supported by extensive evidence and testing. A scientific law describes what happens; a theory explains why.',e:'<b>Common misconception.</b> In everyday language "theory" means guess. In science, theory = highest level of scientific explanation supported by evidence (germ theory, cell theory, evolution). A scientific law (e.g., Boyle\'s Law) describes a consistent relationship but doesn\'t explain mechanism.'},
{id:10,cat:'c',trap:0,q:'What are the rules for writing a scientific (binomial) name?',a:'Genus capitalized, species lowercase. Both italicized (or underlined if handwritten). Example: Escherichia coli or E. coli after first use.',e:'Binomial nomenclature = two-name system created by Linnaeus. The genus groups related organisms; species is specific. After first full use, genus can be abbreviated to first letter. Staphylococcus aureus → S. aureus. Always italicize or underline in scientific writing.'},
{id:11,cat:'c',trap:0,q:'List the taxonomic rankings from broadest to most specific.',a:'Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species',e:'Memory trick: "Dear King Philip Came Over For Good Soup." Domain is the broadest (Bacteria, Archaea, Eukarya). Species is most specific. A strain is even more specific than species — a genetic variant within a species.'},
{id:12,cat:'c',trap:1,q:'TRAP: Bacteria and Archaea are both prokaryotes — so they belong to the same domain. True or false?',a:'FALSE — they are BOTH prokaryotes structurally but belong to SEPARATE domains: Bacteria and Archaea. Eukarya is the third domain.',e:'<b>Prokaryote describes cell structure (no nucleus), not evolutionary lineage.</b> Archaea and Bacteria diverged long ago. Archaea have unique membrane lipids, different RNA polymerase, and are more closely related to Eukarya than to Bacteria. Three-domain system (Woese) replaced the older five-kingdom system.'},
{id:13,cat:'v',trap:0,q:'What are biofilms and why are they a medical concern?',a:'Biofilms = communities of microorganisms attached to a surface, enclosed in self-produced extracellular matrix. Medical concern: highly resistant to antibiotics and immune defenses — up to 1,000x more resistant than planktonic cells.',e:'Biofilms form on catheters, prosthetic joints, heart valves, and teeth (dental plaque). The matrix protects cells from antibiotics and phagocytes. Many chronic infections involve biofilms (chronic wound infections, device-associated infections). Quorum sensing coordinates biofilm formation.'},
{id:14,cat:'v',trap:0,q:'Why has the sickle-cell trait been perpetuated in populations exposed to malaria?',a:'Sickle-cell trait (one normal + one sickle allele) provides PROTECTION against malaria — Plasmodium falciparum cannot complete its life cycle in sickled red blood cells. Natural selection maintained this allele in malaria-endemic regions.',e:'This is a classic example of balanced polymorphism — heterozygotes survive better in malaria regions than either homozygote. Two sickle alleles = sickle-cell disease (harmful). Zero sickle alleles = susceptible to malaria. One allele = protected. Evolution selected for the heterozygous advantage.'},
{id:15,cat:'v',trap:0,q:'What are three industrial uses for microbes?',a:'1. Food production (fermentation — yogurt, beer, cheese) 2. Pharmaceutical production (insulin, antibiotics) 3. Bioremediation (cleaning up oil spills, toxic waste)',e:'Microbes are workhorses of biotechnology. Recombinant E. coli produces human insulin. Penicillium makes penicillin. Yeast ferments sugars to alcohol. Bacteria break down petroleum. Understanding microbial metabolism enables us to harness these capabilities industrially.'},
{id:16,cat:'k',trap:0,q:'What is the purpose of aseptic technique in the microbiology lab?',a:'To prevent contamination of cultures, media, and specimens — and to protect the researcher from exposure to potentially harmful microorganisms.',e:'Aseptic technique includes: flaming loop before/after use, working near Bunsen burner, keeping lids on media, not talking over open cultures, using sterile technique for transfers. Both directions matter — protecting the culture AND protecting yourself.'},
{id:17,cat:'k',trap:0,q:'What is a colony and what technique allows for colony isolation?',a:'Colony = visible mass of cells arising from a single cell (or group). Streak plate technique uses an inoculating loop to progressively dilute bacteria across plate surface until single cells deposit and form isolated colonies.',e:'Isolated colonies are essential for identifying pure cultures. Each colony is theoretically clonal (genetically identical). The streak plate method dilutes the sample across the agar in a pattern (typically quadrant method) until individual cells are separated enough to form distinct colonies.'},
{id:18,cat:'k',trap:1,q:'TRAP: A simple stain and a structural stain provide the same information. True or false?',a:'FALSE — simple stain uses ONE dye to reveal basic cell size, shape, and arrangement. Structural stains (Gram, acid-fast, endospore) use multiple dyes to reveal specific cell structures or chemical properties.',e:'<b>Simple stain = basic morphology only. Structural stain = reveals specific features.</b> Gram stain reveals cell wall composition (positive vs negative). Acid-fast stain reveals mycolic acid in cell walls (Mycobacterium). Endospore stain reveals heat-resistant spores. Each has specific clinical relevance.'},
{id:19,cat:'k',trap:0,q:'How does the Gram stain work and what are sources of error?',a:'1. Crystal violet (primary stain) 2. Iodine (mordant — fixes dye) 3. Alcohol/acetone decolorizer 4. Safranin (counterstain). Gram+ = purple (thick peptidoglycan retains crystal violet). Gram− = pink (thin PG loses crystal violet, takes safranin). Errors: over-decolorizing makes Gram+ appear negative; old cultures may give false negatives.',e:'The key step is decolorization — too brief = false positive (gram neg looks gram pos). Too long = false negative (gram pos looks gram neg). Cell age matters: old gram-positive cells may lose their wall integrity and stain gram-negative (false negative). Fresh cultures give most accurate results.'},
{id:20,cat:'k',trap:0,q:'What are the clinical applications of the acid-fast stain?',a:'Detects Mycobacterium tuberculosis (TB) and Mycobacterium leprae (leprosy) — both have waxy mycolic acid in cell walls that resists standard Gram staining. Acid-fast positive = pink/red cells retained after acid-alcohol wash.',e:'Mycobacteria are neither Gram-positive nor Gram-negative effectively — their thick waxy coat resists crystal violet penetration. The Ziehl-Neelsen acid-fast stain uses carbol fuchsin with heat, then decolorizes with acid-alcohol. Only acid-fast organisms (mycobacteria and Nocardia) retain the red dye.'},
{id:21,cat:'k',trap:0,q:'How does immersion oil improve microscope resolution?',a:'Immersion oil has the same refractive index as glass — it prevents light rays from bending when passing between the lens and slide, reducing light scatter and increasing resolution at 100x objective.',e:'Without oil, light bends (refracts) as it passes from glass slide through air to lens — this scatters light and reduces resolution. Immersion oil fills the gap with a medium matching the refractive index of glass, allowing more light to enter the objective lens. Only used with the 100x (oil immersion) objective.'},
{id:22,cat:'k',trap:1,q:'TRAP: SEM and TEM both provide the same type of image. True or false?',a:'FALSE — SEM (Scanning Electron Microscope) provides 3D surface images. TEM (Transmission Electron Microscope) provides 2D internal/cross-section images by passing electrons THROUGH the specimen.',e:'<b>SEM = surface, 3D. TEM = internal, 2D.</b> SEM scans surface with electron beam — reveals surface topology (great for cell shape, viral particles on surfaces). TEM transmits electrons through thin sections — reveals internal ultrastructure (organelles, membranes). Both require specimens to be dead and fixed.'},
{id:23,cat:'k',trap:0,q:'What is fluorescence microscopy and what are its advantages?',a:'Fluorescence microscopy uses fluorescent dyes or antibodies that emit light when excited by specific wavelengths. Advantages: highly specific detection of particular molecules/organisms, used for immunofluorescence diagnosis, can visualize living cells.',e:'Fluorescent antibodies (labeled with fluorescent tags) bind specifically to target antigens — glowing cells indicate the target is present. Used to detect specific bacteria in tissue, HIV-infected cells (CD4 count), and cancer markers. More specific than standard staining.'},
{id:24,cat:'p',trap:0,q:'What is the difference between a cation and an anion?',a:'Cation = positively charged ion (lost electrons). Anion = negatively charged ion (gained electrons). Ions form when atoms gain or lose electrons to achieve stable electron configurations.',e:'Na loses one electron → Na+ (cation). Cl gains one electron → Cl− (anion). Opposite charges attract → ionic bond → NaCl (table salt). In solution, electrolytes dissociate into ions — essential for nerve impulses, muscle contraction, and pH balance.'},
{id:25,cat:'p',trap:0,q:'What distinguishes a covalent bond from an ionic bond?',a:'Covalent bond = electrons SHARED between atoms. Ionic bond = electrons TRANSFERRED from one atom to another, creating oppositely charged ions that attract.',e:'Covalent bonds are stronger and more stable (found in organic molecules). Ionic bonds dissociate in water (electrolytes). Polar covalent bonds share electrons unequally — one atom is slightly negative (O in water). This polarity enables hydrogen bond formation, critical for DNA structure and protein folding.'},
{id:26,cat:'p',trap:1,q:'TRAP: O2 is a compound because it contains two oxygen atoms bonded together. True or false?',a:'FALSE — O2 is a MOLECULE (two atoms of the same element bonded together) but NOT a compound. A compound requires atoms of TWO OR MORE DIFFERENT elements.',e:'<b>Molecule = two or more atoms bonded together. Compound = two or more DIFFERENT elements.</b> O2 = molecule, not compound. H2O = molecule AND compound (H and O are different elements). CO2 = molecule and compound. All compounds are molecules but not all molecules are compounds.'},
{id:27,cat:'p',trap:0,q:'What makes a molecule organic and name two organic and two inorganic functional groups.',a:'Organic = contains carbon-hydrogen bonds. Organic functional groups: hydroxyl (−OH), carboxyl (−COOH), amino (−NH2), phosphate (−PO4). Inorganic: water (H2O), carbon dioxide (CO2).',e:'Carbon is unique — it forms 4 bonds, chains, rings, and branched structures. The functional groups determine chemical behavior. Carboxyl = acidic (found in amino acids). Amino = basic. Hydroxyl = polar, soluble in water. Phosphate = found in ATP and nucleic acids.'},
{id:28,cat:'p',trap:0,q:'How do buffers stabilize pH?',a:'Buffers contain a weak acid and its conjugate base — they absorb excess H+ (acid) or OH− (base) to resist pH change. Example: carbonic acid/bicarbonate system in blood maintains pH ~7.4.',e:'Blood pH must stay 7.35–7.45. Bicarbonate buffer: when acid is added, bicarbonate neutralizes H+. When base is added, carbonic acid releases H+. Phosphate buffer works inside cells. Without buffers, metabolic acid production would rapidly kill cells.'},
{id:29,cat:'p',trap:1,q:'TRAP: A catalyst is consumed during the reaction it speeds up. True or false?',a:'FALSE — catalysts (including enzymes) speed up reactions WITHOUT being consumed. They lower activation energy and can be reused.',e:'<b>Enzymes are biological catalysts that are NOT used up.</b> They provide an alternative reaction pathway with lower activation energy. The enzyme-substrate complex forms, reaction proceeds, products release, and the enzyme is free to catalyze again. This is why small amounts of enzyme can process large quantities of substrate.'},
{id:30,cat:'p',trap:0,q:'What are the four classes of biomolecules and their building blocks?',a:'1. Carbohydrates — monosaccharides (glucose). 2. Proteins — amino acids. 3. Lipids — fatty acids + glycerol. 4. Nucleic acids — nucleotides.',e:'All four classes use dehydration synthesis (condensation) to link monomers — water is removed to form bonds. Hydrolysis (adding water) breaks them apart. These four classes perform all major biological functions: energy storage, structural support, catalysis, information storage, and signaling.'},
{id:31,cat:'p',trap:0,q:'How do deoxyribonucleotides (DNA) and ribonucleotides (RNA) differ?',a:'1. Sugar: DNA has deoxyribose (missing one -OH), RNA has ribose. 2. Base: DNA uses thymine, RNA uses uracil. Both use adenine, guanine, cytosine.',e:'Deoxyribose = more chemically stable (missing -OH group). This is why DNA is the long-term storage molecule. RNA is less stable — appropriate for its short-term messenger role. Thymine in DNA vs. Uracil in RNA is tested frequently. Both still pair complementarily: A-T (DNA) or A-U (RNA).'},
{id:32,cat:'p',trap:0,q:'What is the difference between an endergonic and exergonic reaction?',a:'Exergonic = releases energy (products have less energy than reactants) — spontaneous, energy out. Endergonic = requires energy input (products have more energy than reactants) — not spontaneous, energy in.',e:'Cellular respiration = exergonic (releases ATP). Protein synthesis = endergonic (requires ATP). Cells couple them — exergonic reactions fuel endergonic ones through ATP. Catabolism (breakdown) = exergonic. Anabolism (synthesis) = endergonic. ATP is the currency linking them.'},
{id:33,cat:'p',trap:1,q:'TRAP: Saturated fats have double bonds between carbon atoms in their fatty acid chains. True or false?',a:'FALSE — saturated fats have NO double bonds (fully "saturated" with hydrogen). Unsaturated fats have one or more double bonds, creating kinks that make them liquid at room temperature.',e:'<b>Saturated = no double bonds = solid at room temp (butter, lard). Unsaturated = double bonds = liquid at room temp (olive oil).</b> Double bonds create rigid kinks — fatty acid chains cannot pack tightly → stays liquid. Saturated fatty acids pack tightly → solid. This affects membrane fluidity (more unsaturated = more fluid membrane).'},
{id:34,cat:'p',trap:0,q:'What is a protein\'s primary structure and why does it determine all higher levels?',a:'Primary structure = amino acid sequence (determined by DNA). This sequence determines how the protein folds (secondary and tertiary structure) based on the chemical properties of each amino acid side chain.',e:'The sequence of amino acids dictates where hydrophobic regions fold inward, where ionic bonds form, where disulfide bridges connect. Change one amino acid → potentially change folding → potentially lose function. Sickle-cell disease = one amino acid substitution in hemoglobin changes RBC shape.'},
{id:35,cat:'p',trap:0,q:'What are chaperone proteins and why are they important?',a:'Chaperone proteins (heat shock proteins) assist other proteins in folding correctly — they prevent incorrect folding and aggregation, especially under stress conditions like heat.',e:'Proteins must fold correctly to function. Chaperones hold partially folded proteins, prevent improper interactions, and use ATP to help achieve correct conformation. Misfolded proteins can aggregate (prion diseases, Alzheimer\'s). Heat stress triggers chaperone production — hence "heat shock proteins."'},
{id:36,cat:'v',trap:0,q:'What are three industrial uses of bioremediation?',a:'1. Oil spill cleanup (hydrocarbon-degrading bacteria). 2. Heavy metal detoxification (bacteria can bind/transform toxic metals). 3. Sewage treatment (bacteria break down organic waste).',e:'Pros of bioremediation: cost-effective, environmentally gentle, can access contaminated soil that physical cleanup cannot. Cons: slow, unpredictable, microbes may die or fail in field conditions, may create toxic byproducts. The Deepwater Horizon spill used bioremediation bacteria to degrade oil.'},
{id:37,cat:'c',trap:0,q:'What is a strain and how does it differ from a species?',a:'A strain = a genetic variant within a species with slightly different characteristics. Species share fundamental genetic and physiological features; strains differ in minor traits like toxin production, antibiotic resistance, or antigen expression.',e:'Example: E. coli is a species. E. coli O157:H7 is a dangerous strain with specific virulence genes not found in normal E. coli strains. Strain differences matter clinically — an antibiotic-resistant strain of S. aureus (MRSA) is the same species as susceptible S. aureus but behaves very differently.'},
{id:38,cat:'v',trap:0,q:'What are the three symbiotic relationships and give a healthcare example of each?',a:'Mutualism: gut E. coli produces vitamin K for host (both benefit). Commensalism: Staphylococcus epidermidis on skin (benefits, host unaffected). Parasitism: Mycobacterium tuberculosis in lungs (benefits, host harmed).',e:'Understanding symbiosis helps predict when normal microbiota becomes pathogenic. Commensal organisms become opportunistic pathogens when host immunity fails. The same organism can shift from commensal to pathogen depending on host status and location (E. coli in gut = commensal; in bladder = pathogen).'},
{id:39,cat:'k',trap:0,q:'What type of media is recommended for isolating bacteria and why?',a:'Solid media (agar plates) — bacteria form visible, countable, isolated colonies that can be picked for pure culture. Liquid media allows growth but colonies intermingle and cannot be isolated.',e:'Agar is used because it is solid at incubation temperature (melts at 100°C, solidifies at ~45°C), is not digested by most bacteria, and provides a stable surface. The streak plate method on solid media is the gold standard for isolation of pure cultures.'},
{id:40,cat:'p',trap:0,q:'What are NAD+ and FAD coenzymes and what is their function?',a:'NAD+ (nicotinamide adenine dinucleotide) and FAD (flavin adenine dinucleotide) are electron carriers — they accept electrons (becoming NADH and FADH2) in catabolic reactions and deliver them to the electron transport chain for ATP production.',e:'Think of NAD+ and FAD as rechargeable electron "buckets." They pick up high-energy electrons during glycolysis and Krebs cycle (becoming NADH/FADH2), carry them to the electron transport chain, drop off the electrons to generate ATP, and return as empty NAD+/FAD to pick up more. Essential to understanding cellular respiration.'},
{id:41,cat:'p',trap:1,q:'TRAP: Hydrolysis reactions build biomolecules by removing water. True or false?',a:'FALSE — dehydration synthesis (condensation) BUILDS polymers by removing water. Hydrolysis BREAKS polymers by ADDING water.',e:'<b>Dehydration synthesis = remove water = BUILD. Hydrolysis = add water = BREAK.</b> Mnemonic: "Hydro" = water, "lysis" = break. When you eat protein, digestive enzymes perform hydrolysis to break peptide bonds (add water). When cells make protein, ribosomes perform dehydration synthesis (remove water between amino acids).'},
{id:42,cat:'p',trap:0,q:'What are electrolytes and why are they biologically important?',a:'Electrolytes = ions that conduct electricity in solution (Na+, K+, Ca2+, Cl−, HCO3−). Essential for nerve impulse transmission, muscle contraction, fluid balance, and pH regulation.',e:'Action potentials rely on Na+ rushing in and K+ rushing out of neurons. Muscle contraction requires Ca2+. IV fluids contain electrolytes to maintain balance. Electrolyte imbalances (hyponatremia, hyperkalemia) can cause arrhythmias, seizures, and death — critically important in nursing practice.'},
{id:43,cat:'v',trap:0,q:'What are Koch\'s postulates limitations in modern microbiology?',a:'1. Some pathogens cannot be cultured in lab (viruses, some bacteria). 2. Some diseases only affect humans (ethics prevent testing postulate 3). 3. Some healthy people carry pathogens without disease. 4. Some diseases are caused by multiple agents (multifactorial).',e:'HIV cannot be grown in standard culture. Leprosy cannot be grown in artificial media. Healthy H. pylori carriers never develop ulcers. Modern molecular Koch\'s postulates (Falkow) address these limitations — using gene sequences instead of pure culture to establish causation.'},
{id:44,cat:'c',trap:0,q:'What are the two prokaryotic domains and one key difference between them?',a:'Bacteria and Archaea. Key difference: Archaea have unique ether-linked membrane lipids (vs. ester-linked in bacteria) and different RNA polymerase structure. Archaea often live in extreme environments.',e:'Both are prokaryotes (no membrane-bound nucleus, 70S ribosomes, no membrane-bound organelles) but they diverged billions of years ago. Archaea cell membranes are more chemically stable (ether bonds resist heat/acid) — advantage in extreme environments like hot springs, salt lakes, deep-sea vents.'},
{id:45,cat:'p',trap:0,q:'What is the pH scale and what pH ranges are acidic, neutral, and basic?',a:'pH scale: 0–14. Acidic = pH < 7 (more H+ ions). Neutral = pH 7. Basic/alkaline = pH > 7 (more OH− ions). Each unit = 10x change in H+ concentration.',e:'pH = −log[H+]. The logarithmic scale means pH 5 has 10x MORE H+ than pH 6, and 100x more than pH 7. Stomach acid = pH 1.5–3. Blood = pH 7.35–7.45. Even small pH changes are clinically significant — acidosis (<7.35) and alkalosis (>7.45) are medical emergencies.'},
{id:46,cat:'k',trap:1,q:'TRAP: The Gram stain is always reliable regardless of culture age. True or false?',a:'FALSE — older cultures may give false negatives (Gram-positive organisms appear pink/Gram-negative) because aging causes cell wall damage, allowing crystal violet to wash out during decolorization.',e:'<b>Fresh cultures (18–24 hours) give most reliable Gram stain results.</b> Old cultures: cell walls degrade → Gram-positive bacteria lose ability to retain crystal violet → appear Gram-negative falsely. This is a critical source of error. Always note culture age when interpreting Gram stain results.'},
{id:47,cat:'p',trap:0,q:'What is the central dogma of molecular biology?',a:'DNA → (transcription) → RNA → (translation) → Protein. Genetic information flows from DNA to RNA to protein.',e:'DNA is the master copy (stored in nucleus/nucleoid). mRNA is the working copy (carries message to ribosome). Protein is the functional product. Reverse transcriptase (in retroviruses like HIV) reverses the first step: RNA → DNA. CRISPR edits the DNA level. Antibiotics often target transcription or translation.'},
{id:48,cat:'v',trap:0,q:'What roles does normal microbiota serve in the host?',a:'1. Competitive exclusion of pathogens 2. Vitamin production (K, B12) 3. Immune system training 4. Digestion assistance 5. Protection via antimicrobial substances',e:'Gut microbiota (microbiome) has 10x more microbial cells than human cells. They ferment dietary fiber, produce short-chain fatty acids, train mucosal immunity, and prevent colonization by pathogens. Dysbiosis (disruption) is linked to IBD, obesity, anxiety, and C. difficile infection.'},
{id:49,cat:'v',trap:1,q:'TRAP: Emerging diseases are always caused by brand-new pathogens that have never existed before. True or false?',a:'FALSE — emerging diseases can be caused by existing pathogens that changed (mutation, new host) OR spread to new geographic areas OR are newly recognized. Re-emerging diseases are known diseases that resurge.',e:'<b>Emerging ≠ always new.</b> HIV emerged when it crossed from chimps to humans. SARS-CoV-2 evolved from existing coronaviruses. West Nile virus is not new — it spread to new regions. Re-emerging: tuberculosis resurgence due to drug resistance. Understanding emergence helps predict and prevent future outbreaks.'},
{id:50,cat:'v',trap:0,q:'What is biogenesis and how did Pasteur prove it?',a:'Biogenesis = life arises only from pre-existing life. Pasteur proved it with swan-neck flask experiments — broth stayed clear until the neck was broken, showing airborne microbes (not spontaneous generation) caused contamination.',e:'Before Pasteur, spontaneous generation (abiogenesis) claimed maggots arose from meat, mice from grain, microbes from broth. Pasteur\'s control (intact swan-neck) and experimental (broken neck) flasks showed that curved neck prevented microbes from reaching broth — definitively ending spontaneous generation debate and establishing the germ theory foundation.'},
];

let ans={};let cf='all';
function render(){
  const fl=cf==='all'?Q:cf==='t'?Q.filter(q=>q.trap):Q.filter(q=>q.cat===cf);
  const g=document.getElementById('grid');g.innerHTML='';
  fl.forEach(q=>{
    const tc=q.cat==='v'?'tv':q.cat==='p'?'tp':q.cat==='c'?'tc':q.cat==='k'?'tk':'tt';
    const tl=q.cat==='v'?'Micro Basics':q.cat==='p'?'Chemistry':q.cat==='c'?'Taxonomy':q.cat==='k'?'Lab/Microscopy':'Exam Trap';
    const d=document.createElement('div');d.className='qcard';
    d.innerHTML=`<div class="qh"><span class="qn">Q${String(q.id).padStart(2,'0')}</span><div class="qt">${q.q}${q.trap?'<span class="trap-pill">⚠ Trap</span>':''}</div><span class="qtag ${tc}">${tl}</span></div>
    <div class="qans"><div class="al">Answer</div><div class="at">${q.a}</div></div>
    <div class="qexp"><div class="el">Why it matters</div><div class="et">${q.e}</div></div>`;
    g.appendChild(d);
  });
  upd();
}
function upd(){
  const t=Object.keys(ans).length;
  document.getElementById('sa').textContent=t;
  document.getElementById('sr').textContent=50-t;
}
function filt(c,btn){cf=c;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function resetAll(){ans={};render();}
render();
</script>
