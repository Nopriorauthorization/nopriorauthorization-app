<script>
const Q=[
{id:1,cat:'a',trap:0,q:'How did eukaryotic mitochondria and chloroplasts likely develop according to endosymbiotic theory?',a:'A proto-eukaryotic cell engulfed aerobic bacteria (became mitochondria) and cyanobacteria (became chloroplasts) without digesting them. Mutual benefit led to permanent integration. Evidence: both have double membranes, circular DNA, 70S ribosomes, and divide by binary fission.',e:'Lynn Margulis proposed endosymbiotic theory in 1967. Mitochondria resemble alpha-proteobacteria. Chloroplasts resemble cyanobacteria. The outer membrane is from the host cell, the inner membrane is the original bacterial membrane. All eukaryotes have mitochondria; only photosynthetic eukaryotes have chloroplasts.'},
{id:2,cat:'a',trap:0,q:'Name at least three ways eukaryotes differ from prokaryotes.',a:'1. Membrane-bound nucleus 2. Membrane-bound organelles 3. 80S ribosomes (vs 70S) 4. Multiple linear chromosomes (vs single circular) 5. Larger cells (10-100 μm vs 1-10 μm) 6. Mitosis/meiosis for division 7. Complex cytoskeleton',e:'These differences are the basis for selective toxicity in antimicrobials — drugs targeting prokaryotic features (70S ribosomes, peptidoglycan, unique enzymes) leave eukaryotic cells unharmed. The nuclear membrane also separates transcription (nucleus) from translation (cytoplasm) in eukaryotes — allowing mRNA processing.'},
{id:3,cat:'a',trap:0,q:'List key differences between mitosis and meiosis.',a:'Mitosis: produces 2 identical diploid daughter cells (2n→2n), for growth/repair, one division round. Meiosis: produces 4 haploid gametes (2n→4 cells of n), for sexual reproduction, two division rounds, genetic recombination (crossing over).',e:'Mitosis = growth, repair, asexual reproduction. Meiosis = sexual reproduction only. Crossing over in meiosis I creates genetic diversity. Some pathogens use both — Plasmodium (malaria) has a complex life cycle using both mitosis (asexual, in human host) and meiosis (sexual, in mosquito host).'},
{id:4,cat:'a',trap:1,q:'TRAP: Endocytosis and phagocytosis are the same process. True or false?',a:'FALSE — phagocytosis is ONE TYPE of endocytosis. Endocytosis = general term for bringing material into cell by membrane engulfment. Two main types: phagocytosis (cell eating — large particles) and pinocytosis (cell drinking — fluids/dissolved molecules).',e:'<b>Phagocytosis ⊂ Endocytosis.</b> Phagocytosis engulfs large particles (bacteria, dead cells) — forms phagosome → fuses with lysosome → phagolysosome → degradation. Pinocytosis: receptor-mediated endocytosis brings specific molecules in via clathrin-coated pits. Both are used by immune cells. Exocytosis = reverse (secretion).'},
{id:5,cat:'a',trap:0,q:'Which eukaryotic kingdoms include unicellular, multicellular, and photosynthetic organisms?',a:'Unicellular: Protista (amoeba, Paramecium), some Fungi (yeast). Multicellular: Animalia, Plantae, Fungi (molds). Both: Protista, Fungi. Photosynthetic: Plantae, some Protista (algae). Animalia = multicellular only, no photosynthesis.',e:'Protista is the most diverse kingdom — it\'s essentially a "catch-all" for eukaryotes that don\'t fit the other kingdoms. Algae are photosynthetic protists. Amoeba, Paramecium are animal-like protists. This diversity makes protists hard to classify consistently.'},
{id:6,cat:'d',trap:0,q:'What are the two main groupings of helminths?',a:'1. Platyhelminthes (flatworms): tapeworms (cestodes) and flukes (trematodes). 2. Nematoda (roundworms): pinworms, hookworms, Ascaris, Trichinella.',e:'Helminths are macroscopic parasitic worms — visible to naked eye. Unlike most microbiology subjects, these are large. Diagnosis often involves finding eggs or larvae in stool/tissue. Treatment: antihelminthic drugs (albendazole, mebendazole, praziquantel). Cestodes (tapeworms) have no digestive system — absorb nutrients directly through tegument.'},
{id:7,cat:'c',trap:0,q:'What are the tubular extensions that make up most of fungal body called and what is their function?',a:'Hyphae — long, branching filaments that form the mycelium (mass of hyphae). Functions: absorb nutrients, extend into substrate, some form reproductive structures. Septate hyphae have cross-walls; coenocytic (aseptate) hyphae have no cross-walls and multiple nuclei flow freely.',e:'Fungi are absorptive heterotrophs — they secrete digestive enzymes externally then absorb the products. Hyphae increase surface area for absorption. Septate hyphae (most fungi) compartmentalize if one section dies. Coenocytic hyphae (Mucor, Rhizopus — cause mucormycosis) allow rapid cytoplasmic streaming for growth.'},
{id:8,cat:'c',trap:0,q:'Name the types of sexual and asexual fungal spores and how they are made.',a:'Asexual: Conidia (produced externally on conidiophores — Aspergillus, Penicillium), Sporangiospores (inside sporangium — Rhizopus), Arthrospores (fragmented hyphae), Blastospores (budding — yeast). Sexual: Ascospores (inside ascus — Ascomycetes), Basidiospores (on basidium — Basidiomycetes), Zygospores (fusion of + and − mating types).',e:'Asexual spores allow rapid dispersal without finding a mate. Sexual spores create genetic diversity through recombination. Classification of fungi is largely based on sexual spore type: Ascomycetes (sac fungi — Aspergillus, Candida, dermatophytes), Basidiomycetes (club fungi — Cryptococcus), Zygomycetes (Mucor, Rhizopus).'},
{id:9,cat:'c',trap:1,q:'TRAP: Fungal plasma membranes are identical to other eukaryotic plasma membranes. True or false?',a:'FALSE — fungal plasma membranes contain ERGOSTEROL instead of cholesterol (found in animal cells). This difference is the target of antifungal drugs (azoles, polyenes) that disrupt ergosterol synthesis or function.',e:'<b>Fungi = ergosterol. Animals = cholesterol. Bacteria = no sterols (mostly).</b> Azole antifungals (fluconazole, itraconazole) inhibit ergosterol synthesis. Polyene antifungals (amphotericin B, nystatin) bind ergosterol directly and form pores. Since human cells use cholesterol (not ergosterol), these drugs selectively target fungi with minimal human cell toxicity.'},
{id:10,cat:'c',trap:0,q:'What is a mycosis and give an example from each category.',a:'Mycosis = fungal infection. Categories: Superficial (tinea versicolor — skin surface only), Cutaneous (ringworm/tinea — skin, hair, nails), Subcutaneous (sporotrichosis — below skin), Systemic (histoplasmosis — internal organs), Opportunistic (Candida, Aspergillus — in immunocompromised).',e:'Depth of infection determines severity and treatment. Superficial infections need topical treatment. Systemic mycoses require oral/IV antifungals for months. Opportunistic mycoses are major killers in HIV/AIDS patients and transplant recipients. Candida is the most common healthcare-acquired fungal infection.'},
{id:11,cat:'d',trap:0,q:'What are animal-like protists called and how are they primarily classified?',a:'Animal-like protists = protozoa. Primarily classified by motility mechanism: 1. Sarcodina (pseudopods — Amoeba, Entamoeba) 2. Mastigophora (flagella — Giardia, Trypanosoma) 3. Ciliophora (cilia — Paramecium, Balantidium) 4. Apicomplexa (no motility in adult form — Plasmodium, Toxoplasma, Cryptosporidium)',e:'Classification by motility reflects fundamental biological differences. Apicomplexans are particularly medically important — they have a complex apical complex for host cell penetration. All cause serious disease: Plasmodium (malaria), Toxoplasma (toxoplasmosis), Cryptosporidium (cryptosporidiosis — especially dangerous in HIV patients).'},
{id:12,cat:'a',trap:0,q:'What is the eukaryotic glycocalyx and what does it do?',a:'Glycocalyx = carbohydrate coating on the outer surface of the plasma membrane (sugar chains attached to membrane proteins and lipids). Functions: cell-cell recognition, cell adhesion, protection from immune attack, receptor function, tissue organization.',e:'The glycocalyx is the cell\'s "identity card." Blood type antigens (ABO) are glycocalyx components. Cancer cells often have altered glycocalyx — allowing them to evade immune recognition. Mucus is essentially secreted glycocalyx components. HIV targets CD4 receptors on the T-cell glycocalyx.'},
{id:13,cat:'a',trap:1,q:'TRAP: Prokaryotic and eukaryotic flagella are structurally similar since both propel the cell. True or false?',a:'FALSE — completely different structures. Prokaryotic: made of flagellin, solid, extracellular, rotates, powered by proton motive force. Eukaryotic: made of tubulin (9+2 microtubule arrangement), hollow, enclosed in plasma membrane, waves/undulates, powered by dynein ATPase.',e:'<b>Same function, completely different structures — convergent evolution.</b> 9+2 arrangement = 9 outer doublet microtubules + 2 central singlets. Dynein motor proteins slide doublets past each other causing bending. Immotile cilia syndrome (Kartagener) = defective dynein → no ciliary motion → infertility, chronic respiratory infections, situs inversus.'},
{id:14,cat:'a',trap:0,q:'What are cilia, where are they found, and how do they differ from flagella?',a:'Cilia = shorter, more numerous, coordinated wave-like movement. Found: respiratory tract epithelium (mucociliary escalator), fallopian tubes, ependymal cells of brain ventricles. Flagella = longer, fewer (1-2), undulating motion. Both have 9+2 structure and dynein motor.',e:'Respiratory cilia beat 12-15x per second to sweep mucus and trapped particles toward the throat. Smoking damages cilia (smoker\'s cough compensates). Fallopian tube cilia help move egg toward uterus — damaged cilia → ectopic pregnancy risk. Same 9+2 structure as flagella but functionally adapted for surface sweeping vs. propulsion.'},
{id:15,cat:'b',trap:0,q:'How are eukaryotic ribosomes different from prokaryotic ribosomes?',a:'Eukaryotic: 80S (60S large + 40S small subunits), in cytoplasm and rough ER. Prokaryotic: 70S (50S large + 30S small), throughout cytoplasm. Both use same basic translation mechanism but different enough structurally for selective antibiotic targeting.',e:'The 80S vs 70S distinction underlies antibiotic selective toxicity. Free 80S ribosomes make cytoplasmic proteins. Membrane-bound 80S ribosomes on rough ER make secretory and membrane proteins (including antibodies, insulin). Mitochondrial 70S ribosomes are targeted by some antibiotics — causing side effects.'},
{id:16,cat:'b',trap:0,q:'What is the cytoskeleton made of and what does it do? Describe the centrosome.',a:'Three components: microfilaments (actin — cell shape, movement, cytokinesis), intermediate filaments (various proteins — structural support, nuclear lamina), microtubules (tubulin — cell shape, organelle movement, mitosis). Centrosome: MTOC (microtubule organizing center) containing two centrioles — organizes mitotic spindle during cell division.',e:'Microfilaments form the cortex under plasma membrane — responsible for pseudopod formation (phagocytosis). Intermediate filaments provide mechanical strength — keratin in epithelial cells, vimentin in mesenchymal cells. Microtubules form the mitotic spindle. Drugs targeting cytoskeleton: taxol (stabilizes microtubules — cancer treatment), colchicine (disrupts microtubules — gout treatment).'},
{id:17,cat:'b',trap:1,q:'TRAP: The smooth ER and rough ER perform the same functions since they are both endoplasmic reticulum. True or false?',a:'FALSE — Rough ER (has ribosomes): synthesizes membrane and secretory proteins. Smooth ER: lipid synthesis, drug detoxification, calcium storage (muscle), steroid synthesis (liver, adrenal glands). Completely different functions.',e:'<b>Rough ER = protein factory (ribosomes). Smooth ER = lipid/detox factory.</b> Liver has abundant smooth ER for drug metabolism (cytochrome P450 enzymes). Muscle cells have smooth ER (called sarcoplasmic reticulum) for calcium storage/release. Liver disease impairs drug metabolism. Barbiturate use induces more smooth ER — explains drug tolerance.'},
{id:18,cat:'b',trap:0,q:'What are the two functions of the Golgi apparatus?',a:'1. Modification of proteins and lipids (glycosylation — adding sugar chains, phosphorylation, sorting) 2. Packaging and directing proteins to correct destination (secretion, lysosomes, plasma membrane)',e:'The Golgi is the cell\'s "post office" — proteins arrive from ER, get modified (stamped/sorted), then are shipped to correct destinations. cis face receives from ER, trans face sends to destinations. Without Golgi modification, proteins cannot reach correct locations. I-cell disease = defective Golgi sorting → enzymes secreted outside instead of going to lysosomes → lysosomal storage disease.'},
{id:19,cat:'b',trap:0,q:'What are lysosomes and what do they do?',a:'Lysosomes = membrane-bound organelles containing hydrolytic enzymes (proteases, lipases, nucleases, glycosidases) at pH 4.5-5. Functions: digestion of phagocytosed material (bacteria, dead cells), autophagy (recycling damaged organelles), apoptosis.',e:'Lysosomal enzymes work optimally at pH 4.5 — if lysosomes rupture, the cytoplasmic pH 7.2 renders them relatively harmless. Lysosomal storage diseases: enzyme deficiencies → undigested material accumulates (Tay-Sachs — GM2 ganglioside accumulation → neurodegeneration). Macrophages use lysosomes to destroy phagocytosed bacteria — some bacteria (TB, Legionella) evade lysosomal fusion.'},
{id:20,cat:'b',trap:0,q:'Why are mitochondria called the powerhouse of the cell and what bacterial features do they share?',a:'Powerhouse: produce most cellular ATP via oxidative phosphorylation (ETC + ATP synthase). Bacterial features: double membrane, circular DNA, 70S ribosomes, binary fission-like division, similar size to bacteria — all supporting endosymbiotic theory.',e:'Mitochondria generate ~90% of cellular ATP. The inner membrane is highly folded (cristae) to maximize surface area for ETC and ATP synthase. Mitochondrial diseases (maternal inheritance of mtDNA) cause energy-deficient syndromes affecting high-demand tissues (brain, muscle, heart). Cyanide poisoning blocks ETC → stops ATP production → death.'},
{id:21,cat:'c',trap:0,q:'Define mycosis and explain the difference between cutaneous and subcutaneous infections.',a:'Mycosis = any fungal infection. Cutaneous: affects skin, hair, and nails — caused by dermatophytes (Tinea/ringworm). Subcutaneous: penetrates below skin into subcutaneous tissue — usually via puncture wound (sporotrichosis, chromoblastomycosis). Neither typically spreads systemically in healthy people.',e:'Cutaneous vs. subcutaneous distinction matters for treatment depth and duration. Tinea pedis (athlete\'s foot) = cutaneous → topical antifungal (miconazole). Sporotrichosis (rose-thorn prick) = subcutaneous → oral itraconazole for months. The skin is a natural barrier — breaching it (puncture, burn) allows subcutaneous infection.'},
{id:22,cat:'c',trap:1,q:'TRAP: Dermatophytes cause disease by invading living tissue deep in the dermis. True or false?',a:'FALSE — dermatophytes infect only DEAD, keratinized tissue (skin, hair, nails). They cannot invade living tissue because they cannot tolerate body temperature and immune responses deeper in tissue.',e:'<b>Dermatophytes = dead keratin only. Cannot invade living tissue.</b> This limits their infection depth but also means they are hard to eradicate — nails have limited blood supply (topical drugs cannot reach nail bed). Oral terbinafine or griseofulvin needed for nail infections (months of treatment). Ring-shaped lesion of ringworm = active border of growing fungus with central clearing as immune response controls it.'},
{id:23,cat:'d',trap:0,q:'Why is it challenging to develop specific criteria for describing protists?',a:'Protists are an artificial grouping — defined by EXCLUSION ("eukaryotes that are not animals, plants, or fungi"). They include organisms more distantly related to each other than animals are to fungi. Extreme diversity in size, nutrition, motility, reproduction, and life cycles.',e:'Protista is not a natural (monophyletic) group — it\'s a "catch-all." Modern classification is moving toward multiple separate kingdoms for different protist lineages. Challenges: some are photosynthetic (like plants), some predatory (like animals), some parasitic, some form alternating life cycle stages. Giardia has two nuclei and no mitochondria (secondary loss).'},
{id:24,cat:'a',trap:0,q:'What eukaryotic kingdoms include multicellular organisms? Which include photosynthetic organisms?',a:'Multicellular: Animalia (all), Plantae (all), Fungi (most — except unicellular yeasts), Protista (some — algae, slime molds). Photosynthetic: Plantae (all), Protista (algae — green, red, brown). Fungi and Animalia: NOT photosynthetic.',e:'Fungi were once classified with plants due to their immobility but they are actually more closely related to animals (both absorptive/heterotrophic). Key difference: plants make their own food (autotrophs), fungi absorb external nutrition after extracellular digestion. This matters for treatment — plant-based drugs often don\'t work against fungi.'},
{id:25,cat:'c',trap:0,q:'What is a dimorphic fungus and why is dimorphism a virulence factor?',a:'Dimorphic = two growth forms: mold (hyphae) at environmental temperature (~25°C), yeast at body temperature (~37°C). The yeast form is more resistant to phagocytosis and immune attack. Examples: Histoplasma, Coccidioides, Blastomyces, Sporothrix.',e:'Temperature-triggered dimorphism is a key virulence mechanism. Environmental mold spores (conidia) are inhaled → body temperature → converts to yeast form → yeast resists macrophage killing. Memory aid: "mold in the cold, yeast in the heat." The transformation requires metabolic reprogramming. Understanding dimorphism explains why endemic fungi (histoplasmosis, coccidioidomycosis) can cause systemic disease.'},
{id:26,cat:'b',trap:0,q:'What are secretory vesicles and how do they work?',a:'Secretory vesicles = membrane-bound sacs that transport proteins/lipids from Golgi to plasma membrane for exocytosis. Two types: constitutive (continuous secretion — mucus, ECM proteins) and regulated (secretion only when signaled — neurotransmitters, hormones, digestive enzymes).',e:'Regulated secretion is critical in medicine. Insulin = regulated secretion from beta cells (triggered by glucose). Neurotransmitters = regulated exocytosis at synapses. Mast cell degranulation (regulated exocytosis of histamine vesicles) causes allergic reactions. Botulinum toxin blocks neurotransmitter vesicle fusion → flaccid paralysis.'},
{id:27,cat:'b',trap:1,q:'TRAP: The nuclear membrane is impermeable — nothing can pass through it. True or false?',a:'FALSE — the nuclear membrane has nuclear pores (large protein complexes) that selectively allow passage of: proteins INTO nucleus (transcription factors, histones), RNA OUT of nucleus (mRNA, tRNA, rRNA), and small molecules by diffusion.',e:'<b>Nuclear pores allow selective transport — not impermeable.</b> Nuclear pore complexes (NPCs) are one of the largest protein complexes in cells (~120 MDa). They act as gatekeepers. Proteins need nuclear localization signals (NLS) to be actively transported in. mRNA needs export signals to get out. Some viruses (HIV, influenza) exploit nuclear pores to deliver their genomes into the nucleus.'},
{id:28,cat:'c',trap:0,q:'How does Candida albicans structural morphogenesis contribute to its virulence?',a:'Candida can switch between yeast (blastoconidia — commensal, less invasive) and hyphal forms (more invasive, penetrates tissue). Hyphae express different virulence factors: adhesins, proteases, invasins. Biofilm formation in hyphal form resists antifungals and immune cells.',e:'Morphogenesis switching is regulated by environmental signals (temperature, pH, CO2, serum, nutrient limitation). White-to-opaque switching allows further adaptation. The hyphal form is what causes invasive candidiasis. Biofilms on catheters and implants are a major clinical problem — 15x more resistant to fluconazole than planktonic cells.'},
{id:29,cat:'d',trap:0,q:'What are the two main categories of endocytosis and how do they differ?',a:'Phagocytosis (cell eating): engulfs large particles (bacteria, dead cells) using pseudopods — receptor-mediated, requires actin cytoskeleton. Pinocytosis (cell drinking): engulfs fluids and dissolved molecules — includes receptor-mediated endocytosis (clathrin-coated pits) for specific molecules.',e:'Phagocytosis is a key immune defense — neutrophils and macrophages engulf pathogens. Receptor-mediated endocytosis allows cells to specifically internalize nutrients (LDL cholesterol), hormones, and unfortunately — viruses (HIV binds CD4 receptor → receptor-mediated endocytosis). Familial hypercholesterolemia = defective LDL receptors → cannot remove LDL from blood.'},
{id:30,cat:'a',trap:0,q:'What are three features of the eukaryotic nucleus?',a:'1. Double membrane (nuclear envelope) with nuclear pores 2. Contains linear chromosomes with histones 3. Site of DNA replication and transcription 4. Contains nucleolus (rRNA synthesis/ribosome assembly site)',e:'The nucleolus is the "factory within a factory" — inside the nucleus, making ribosomal RNA and assembling ribosomal subunits that are exported to cytoplasm. Enlarged nucleoli are a sign of rapidly dividing cells (cancer). Nuclear lamina (intermediate filaments) supports nuclear shape. Lamin mutations cause premature aging (progeria).'},
{id:31,cat:'b',trap:0,q:'Name three differences between prokaryotic and eukaryotic flagella.',a:'1. Structure: prokaryotic = solid flagellin protein; eukaryotic = 9+2 microtubule (tubulin) arrangement 2. Motion: prokaryotic = rotation; eukaryotic = wave/undulation 3. Power: prokaryotic = proton motive force; eukaryotic = ATP (dynein motor) 4. Location: prokaryotic = outside cell; eukaryotic = enclosed in plasma membrane',e:'These three differences (structure, motion, power source) are all testable individually. The 9+2 arrangement is conserved across all eukaryotes with flagella/cilia — from Chlamydomonas (alga) to human sperm. This evolutionary conservation suggests it appeared early in eukaryotic evolution.'},
{id:32,cat:'c',trap:1,q:'TRAP: Fungi have cell walls made of cellulose, just like plants. True or false?',a:'FALSE — fungal cell walls are made of CHITIN (same polymer as insect exoskeletons). Plant cell walls are made of cellulose. This difference is important for antifungal drug development.',e:'<b>Fungi = chitin walls. Plants = cellulose walls. Bacteria = peptidoglycan walls.</b> Echinocandin antifungals (caspofungin, micafungin) target fungal chitin synthesis (glucan synthase) — no equivalent in animals or plants. Animal cells have no cell wall at all. This is why fungi are harder to treat than bacteria — fewer unique targets.'},
{id:33,cat:'d',trap:0,q:'What is leishmaniasis and what type of protist causes it?',a:'Leishmaniasis: caused by Leishmania species (flagellated protozoan — mastigophora), transmitted by sandfly bites. Three forms: cutaneous (skin ulcers), mucocutaneous (destroys facial tissue), visceral/kala-azar (internal organs — most severe, fatal if untreated).',e:'100 million people at risk worldwide. Leishmania has a complex life cycle: promastigote form in sandfly → amastigote form inside macrophages in human. The parasite actually hides INSIDE macrophages (the cells meant to kill it). Treatment: pentavalent antimonials (toxic), amphotericin B, miltefosine. Visceral leishmaniasis is an AIDS-defining illness.'},
{id:34,cat:'a',trap:0,q:'How do mitosis and meiosis differ and some ways they are similar?',a:'Differences: Mitosis → 2 diploid cells (2n), one division, no recombination, somatic cells. Meiosis → 4 haploid cells (n), two divisions, crossing over/recombination, reproductive cells only. Similarities: both start with DNA replication, both use spindle apparatus, both have prophase/metaphase/anaphase/telophase stages.',e:'Meiosis I separates homologous chromosomes (crossing over occurs here — genetic diversity). Meiosis II separates sister chromatids (like mitosis). Errors in meiosis: nondisjunction → trisomy (Down syndrome, trisomy 21) or monosomy. Some organisms skip meiosis: bacteria use binary fission, some protists have complex alternation of generations.'},
{id:35,cat:'c',trap:0,q:'What are the sexual and asexual spore types in Ascomycetes, Basidiomycetes, and Zygomycetes?',a:'Ascomycetes (sac fungi): sexual = ascospores (in ascus/sac); asexual = conidia. Basidiomycetes (club fungi): sexual = basidiospores (on basidium/club); asexual = variable. Zygomycetes: sexual = zygospores (fusion of opposite mating types); asexual = sporangiospores (in sporangium).',e:'Classification of fungi is largely based on sexual reproduction. Ascomycetes include: Aspergillus, Candida, dermatophytes, Penicillium, Saccharomyces (baker\'s yeast). Basidiomycetes include: Cryptococcus neoformans (meningitis), mushrooms. Zygomycetes: Mucor, Rhizopus (mucormycosis — deadly in diabetics and immunocompromised).'},
{id:36,cat:'b',trap:0,q:'What features of mitochondria are similar to bacteria?',a:'1. Double membrane (outer = host origin, inner = bacterial origin) 2. Circular DNA (no histones) 3. 70S ribosomes (not 80S) 4. Divide by binary fission-like process 5. Similar size to bacteria (~1-2 μm) 6. Own transcription and translation machinery',e:'All mitochondrial DNA is maternal — inherited only through eggs (not sperm). Mitochondrial Eve = hypothetical common maternal ancestor of all modern humans traced through mtDNA. Mitochondrial diseases (MELAS, MERRF) are maternally inherited and affect high-energy tissues (brain, muscle, heart). The 70S ribosomes explain antibiotic mitochondrial toxicity.'},
{id:37,cat:'d',trap:1,q:'TRAP: All protozoa form cysts that are the infectious stage of disease. True or false?',a:'FALSE — infectious stage varies by species. Some: cyst is infectious (Giardia, Entamoeba, Cryptosporidium). Others: trophozoite (active feeding form) is also infectious. Malaria: sporozoites (from mosquito) are the infectious stage. Toxoplasma: tissue cysts or oocysts are infectious.',e:'<b>Infectious stage is species-specific — do not generalize.</b> Giardia: swallow cysts in contaminated water → excyst in duodenum → trophozoites cause diarrhea → encyst in colon → shed in stool. Malaria: mosquito injects sporozoites → liver stage → merozoites → red blood cell stage (symptoms) → gametocytes (mosquito stage). Understanding life cycles is essential for treatment and prevention.'},
{id:38,cat:'b',trap:0,q:'What are the two main classes of endocytosis and what is exocytosis?',a:'Phagocytosis (cell eating) and pinocytosis (cell drinking — includes receptor-mediated). Exocytosis = fusion of vesicles with plasma membrane to secrete contents OUTSIDE the cell. Used for: secretion of hormones, neurotransmitters, digestive enzymes, mucus, ECM proteins.',e:'Exocytosis is also used for removing waste products and remodeling the plasma membrane (recycling membrane components). The endomembrane system (ER → Golgi → vesicles) is the pathway for secretory proteins. Defective exocytosis: cystic fibrosis (defective Cl− channel trafficking to membrane → thick mucus in lungs).'},
{id:39,cat:'c',trap:0,q:'What is the role of ergosterol in fungi and why is it an antifungal target?',a:'Ergosterol = the primary sterol in fungal membranes — maintains membrane fluidity, integrity, and function (analogous to cholesterol in animals). Antifungal target because: 1. Fungi require ergosterol (unique), 2. Human cells use cholesterol (not ergosterol), 3. Drugs targeting ergosterol selectively harm fungi.',e:'Two major antifungal mechanisms using ergosterol: Azoles inhibit ergosterol SYNTHESIS (lanosterol 14α-demethylase). Polyenes (amphotericin B) bind ergosterol DIRECTLY → membrane pores → cell leakage → death. Resistance: Candida reduces ergosterol production or alters the enzyme targeted by azoles. Amphotericin B binds cholesterol with lower affinity — explains kidney toxicity (renal cells have cholesterol).'},
{id:40,cat:'d',trap:0,q:'Describe the life cycle of a parasitic protozoan that infects the human GI tract.',a:'General cycle: Infective cyst ingested (contaminated food/water) → excystation in small intestine → trophozoites colonize intestine → cause symptoms (diarrhea) → encyst in large intestine → cysts excreted in feces → contaminate water/food → cycle repeats.',e:'Example: Giardia lamblia. Cysts survive in cold water for months — resistant to chlorination at normal doses. Only 10-100 cysts needed for infection. Trophozoites have a ventral adhesive disc — attach to intestinal epithelium → block absorption → fatty, foul diarrhea. Diagnosis: stool O&P (ova and parasites) exam or antigen test. Treatment: metronidazole or tinidazole.'},
{id:41,cat:'a',trap:1,q:'TRAP: Eukaryotic cells are always larger than prokaryotic cells. True or false?',a:'FALSE — while TYPICALLY larger (10-100 μm vs 1-10 μm), some eukaryotic cells are small (some yeast = 3-4 μm) and some prokaryotes are large (Thiomargarita namibiensis = 0.75 mm, visible to naked eye).',e:'<b>Size overlap exists — "typically larger" is more accurate than "always larger."</b> Thiomargarita namibiensis (sulfur pearl of Namibia) is the largest known bacterium — visible to naked eye. Nasuia deltocephalinicola has one of the smallest known genomes (~112 genes). Cell size is determined by functional requirements, not domain classification.'},
{id:42,cat:'b',trap:0,q:'What is the function of the centrosome and what organelles does it organize?',a:'Centrosome = MTOC (microtubule organizing center) containing two centrioles at right angles. Functions: 1. Organizes the mitotic spindle during cell division 2. Anchors microtubules 3. Part of basal body (anchors cilia/flagella). Centrioles made of 9 triplet microtubule bundles.',e:'Each daughter cell must receive one centrosome during mitosis. The centrosome duplicates before division. Basal bodies (modified centrioles) anchor cilia at cell surfaces — structurally identical to centrioles. Plants lack centrioles but still form mitotic spindles (using diffuse MTOC). Some cancer cells have extra centrosomes → chromosome segregation errors → genetic instability.'},
{id:43,cat:'c',trap:0,q:'Name the five fungal phyla/groups and a medically important example of each.',a:'1. Ascomycota (sac fungi): Candida, Aspergillus, dermatophytes 2. Basidiomycota (club fungi): Cryptococcus neoformans 3. Zygomycota (pin molds): Mucor, Rhizopus (mucormycosis) 4. Chytridiomycota (chytrids): environmental, amphibian disease 5. Microsporidia: obligate intracellular parasites (immunocompromised patients)',e:'Ascomycota = largest phylum, most pathogens. Cryptococcus neoformans (Basidiomycota) causes cryptococcal meningitis — major killer in AIDS patients. Mucormycosis (Zygomycota) = angioinvasive, very rapid — can spread from sinuses to brain in hours, requires immediate surgical debridement + antifungals. Microsporidia infect GI tract in HIV patients.'},
{id:44,cat:'d',trap:0,q:'What are the two main groupings of helminths and give a medically important example of each.',a:'1. Platyhelminthes (flatworms): Tapeworms (Taenia solium — cysticercosis, pork tapeworm) and Flukes (Schistosoma mansoni — schistosomiasis). 2. Nematoda (roundworms): Ascaris lumbricoides (ascariasis), Trichinella spiralis (trichinosis from undercooked pork).',e:'Helminths are visible to the naked eye — diagnosis often by finding eggs/larvae in stool (O&P exam). Taenia cysticercosis: larvae form cysts in CNS → neurocysticercosis (most common cause of acquired epilepsy worldwide). Schistosomiasis: affects 200 million people. Treatment: praziquantel (flatworms), albendazole/mebendazole (roundworms).'},
{id:45,cat:'b',trap:0,q:'Describe the endomembrane system and its role in protein processing.',a:'Endomembrane system = interconnected network of membranes: nuclear envelope → rough ER (synthesis) → transport vesicles → Golgi (modification/sorting) → vesicles → final destinations (lysosomes, plasma membrane, secretion). Coordinates synthesis, modification, and delivery of proteins and lipids.',e:'The endomembrane system ensures proteins reach correct destinations with correct modifications. Signal sequences on proteins direct them: ER signal sequence → enters ER lumen. Golgi sorting signals → lysosomes, plasma membrane, secretion. Defects: I-cell disease (no mannose-6-phosphate → lysosomal enzymes secreted instead of going to lysosomes → toxic accumulation).'},
{id:46,cat:'a',trap:0,q:'What is the difference between diploid (2n) and haploid (n) cells?',a:'Diploid (2n): two sets of chromosomes (one from each parent) — found in most somatic (body) cells. Haploid (n): one set of chromosomes — found in gametes (egg, sperm). Humans: 2n = 46 chromosomes, n = 23.',e:'Fertilization (egg + sperm) restores diploidy: n + n = 2n. Meiosis restores haploidy from diploid germline cells. Some organisms alternate between haploid and diploid life stages (alternation of generations). Fungi are often haploid in vegetative state. Apicomplexan parasites have complex life cycles with both haploid and diploid stages.'},
{id:47,cat:'c',trap:1,q:'TRAP: Because fungi are eukaryotes like humans, antifungal drugs are inherently more toxic to humans than antibacterial drugs. True or false?',a:'FALSE while partially true — antifungal development IS harder because fungi and humans share many cellular features (both eukaryotes). However, unique fungal targets (ergosterol, chitin, beta-glucan) allow selective toxicity. Some antifungals are well-tolerated; others (amphotericin B) are quite toxic.',e:'<b>Difficulty ≠ impossible selective toxicity.</b> Echinocandins (target fungal-specific glucan synthesis) are very well-tolerated with minimal human toxicity. Azoles (ergosterol synthesis) are generally safe orally. Amphotericin B = "ampho-terrible" for its nephrotoxicity — but it binds ergosterol with higher affinity than cholesterol (still selective, just imperfect). Fungal treatment is harder than bacterial, not impossible.'},
{id:48,cat:'d',trap:0,q:'Compare tapeworms (cestodes) and flukes (trematodes) as two types of platyhelminthes.',a:'Tapeworms: segmented (proglottids), no digestive system (absorb nutrients through tegument), flat, attach to intestinal wall by scolex (head with hooks/suckers), can grow meters long. Flukes: leaf-shaped, have incomplete digestive system, use suckers, infect various organs (liver, blood, lung).',e:'Tapeworms are essentially just reproductive machines with no digestive system. Each proglottid is a reproductive unit producing thousands of eggs. Taenia solium (pork tapeworm) is dangerous because: 1. Intestinal tapeworm (from eating undercooked pork) or 2. Cysticercosis (ingesting eggs → larvae in CNS). The same worm causes two very different diseases depending on what is ingested.'},
{id:49,cat:'b',trap:0,q:'What is autophagy and how does it involve lysosomes?',a:'Autophagy = cellular self-digestion of damaged organelles or excess cellular components. The cell wraps targeted organelle in double membrane (autophagosome) → fuses with lysosome → lysosomal enzymes digest contents → components recycled.',e:'Autophagy is a quality control mechanism and survival strategy. During starvation, autophagy provides nutrients by digesting non-essential components. Damaged mitochondria are selectively removed by mitophagy. Defective autophagy contributes to: neurodegeneration (Parkinson\'s, Alzheimer\'s), cancer. Some bacteria (Mycobacterium, Legionella) hijack the autophagy pathway to survive inside cells.'},
{id:50,cat:'c',trap:0,q:'Why can\'t humans develop drugs targeting the fungal cell wall as easily as bacterial cell wall drugs?',a:'Fungal cell walls contain chitin (β-1,3 and β-1,6 glucans + chitin). While chitin is unique to fungi (and insects), developing selective inhibitors is challenging because: 1. Fungi are eukaryotes like us — many pathways shared 2. Cell wall synthesis machinery shares some structural similarities with human carbohydrate synthesis pathways 3. Getting drugs through the cell wall itself is difficult.',e:'Echinocandins DO successfully target β-1,3-glucan synthase (fungal-specific) — well tolerated, major advance in antifungal therapy. This shows it IS possible to target the fungal cell wall. Chitin synthase is another target in development. The broader challenge is that unlike bacteria (whose many structures are entirely absent from humans), fungi share fundamental eukaryotic biology with us.'},
];
let ans={};let cf='all';
function render(){
  const fl=cf==='all'?Q:cf==='t'?Q.filter(q=>q.trap):Q.filter(q=>q.cat===cf);
  const g=document.getElementById('grid');g.innerHTML='';
  fl.forEach(q=>{
    const tc=q.cat==='a'?'ta':q.cat==='b'?'tb':q.cat==='c'?'tc':q.cat==='d'?'td':'tt';
    const tl=q.cat==='a'?'Eukaryotic Structure':q.cat==='b'?'Organelles':q.cat==='c'?'Fungi':q.cat==='d'?'Protists/Helminths':'Exam Trap';
    const d=document.createElement('div');d.className='qcard';
    d.innerHTML=`<div class="qh"><span class="qn">Q${String(q.id).padStart(2,'0')}</span><div class="qt">${q.q}${q.trap?'<span class="trap-pill">⚠ Trap</span>':''}</div><span class="qtag ${tc}">${tl}</span></div>
    <div class="qans"><div class="al">Answer</div><div class="at">${q.a}</div></div>
    <div class="qexp"><div class="el">Why it matters</div><div class="et">${q.e}</div></div>`;
    g.appendChild(d);
  });
  document.getElementById('sr').textContent=50-Object.keys(ans).length;
}
function filt(c,btn){cf=c;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function resetAll(){ans={};render();}
render();
</script>
