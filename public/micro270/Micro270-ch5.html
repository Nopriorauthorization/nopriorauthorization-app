<script>
const Q=[
{id:1,cat:'a',trap:0,q:'What is the primary difference between genotype and phenotype?',a:'Genotype = the actual DNA sequence (genetic makeup) of an organism — what genes it HAS. Phenotype = the observable characteristics (physical, biochemical, behavioral) resulting from gene expression — what the organism SHOWS.',e:'Same genotype can produce different phenotypes depending on environment (gene-environment interaction). Example: identical twins (same genotype) can have different phenotypes due to epigenetics, lifestyle, environment. Antibiotic susceptibility testing reveals phenotype — the genotype (resistance genes) predicts the phenotype.'},
{id:2,cat:'a',trap:0,q:'What does the central dogma of molecular biology state?',a:'DNA → (transcription) → RNA → (translation) → Protein. Genetic information flows from DNA to RNA to protein. Reverse transcriptase allows RNA → DNA (retroviruses). The central dogma describes how genetic information is expressed.',e:'RNA polymerase performs transcription. Ribosomes perform translation. The central dogma is a one-way information flow under normal circumstances. HIV reverses it using reverse transcriptase (RNA → DNA → integrates into host genome). CRISPR edits at the DNA level. Many antibiotics target transcription (rifampin) or translation (tetracycline, erythromycin).'},
{id:3,cat:'a',trap:0,q:'Describe the building blocks of nucleic acids and how DNA and RNA differ.',a:'Both built from nucleotides (phosphate + sugar + nitrogenous base). DNA: deoxyribose sugar, bases A-T-G-C, double-stranded, stable, long-term storage. RNA: ribose sugar, bases A-U-G-C (uracil replaces thymine), single-stranded, less stable, functional/messenger roles.',e:'Deoxyribose has no 2\'-OH group — more chemically stable than ribose. This stability makes DNA ideal for long-term genetic storage. RNA\'s instability makes it ideal for temporary messages (mRNA degraded after use). The 2\'-OH in RNA allows it to form complex 3D structures enabling catalytic activity (ribozymes).'},
{id:4,cat:'a',trap:1,q:'TRAP: DNA and RNA both use thymine as one of their nitrogenous bases. True or false?',a:'FALSE — DNA uses THYMINE. RNA uses URACIL instead of thymine. Both use adenine, guanine, and cytosine.',e:'<b>Thymine = DNA only. Uracil = RNA only.</b> Thymine has a methyl group that uracil lacks — this helps DNA repair machinery distinguish original DNA from newly synthesized strands (methylation markers). Uracil can form from deamination of cytosine — in DNA this would be a mutation, but repair enzymes recognize and remove uracil from DNA. In RNA, uracil is normal.'},
{id:5,cat:'a',trap:0,q:'Explain DNA\'s chemical 5\' to 3\' directionality.',a:'DNA strands have directionality based on carbon numbering of deoxyribose. The 5\' end has a free phosphate group attached to the 5\' carbon. The 3\' end has a free hydroxyl (-OH) group on the 3\' carbon. The two strands in double-stranded DNA run antiparallel (one 5\'→3\', the other 3\'→5\').',e:'DNA polymerase can only synthesize DNA in the 5\'→3\' direction — it adds new nucleotides to the 3\'-OH end. This directionality creates the leading and lagging strand problem during replication. RNA polymerase also synthesizes 5\'→3\'. This is fundamental to understanding both replication and transcription.'},
{id:6,cat:'b',trap:0,q:'What is the main enzyme that builds DNA during replication and what are its limitations?',a:'DNA polymerase III (prokaryotes) / DNA polymerase δ and ε (eukaryotes). Limitations: 1. Can only add nucleotides to existing 3\'-OH (cannot start a new strand) 2. Can only synthesize 5\'→3\' direction 3. Needs an RNA primer to begin.',e:'The inability to start de novo is why RNA primase is needed — it makes short RNA primers providing the 3\'-OH start point. DNA pol III then extends. The primer is later replaced by DNA pol I (prokaryotes) using its 5\'→3\' exonuclease activity to remove RNA and fill with DNA. DNA ligase seals the final nick.'},
{id:7,cat:'b',trap:0,q:'How is DNA replication started and what role do RNA primers play?',a:'Replication starts at the origin of replication (oriC in prokaryotes — multiple origins in eukaryotes). Helicase unwinds the double helix. Primase synthesizes short RNA primers (providing 3\'-OH for DNA polymerase to extend). SSB proteins stabilize the single strands. Topoisomerase relieves tension ahead of the fork.',e:'RNA primers are essential because DNA polymerase CANNOT start a new strand — it can only extend. After replication, RNA primers are removed (DNA pol I in prokaryotes, RNase H in eukaryotes) and replaced with DNA. The final gap is sealed by DNA ligase. Anticancer drugs targeting topoisomerase (camptothecin, fluoroquinolones targeting gyrase in bacteria) exploit this requirement.'},
{id:8,cat:'b',trap:1,q:'TRAP: The leading strand and lagging strand are synthesized by different enzymes because they go in opposite directions. True or false?',a:'FALSE — both strands are synthesized by DNA polymerase III. The DIFFERENCE is the lagging strand is synthesized DISCONTINUOUSLY in Okazaki fragments (because pol III can only go 5\'→3\' but the lagging strand template runs 3\'→5\' away from the fork).',e:'<b>Same enzyme (DNA pol III), different synthesis pattern.</b> Leading strand: continuous synthesis toward the fork (template runs 3\'→5\'). Lagging strand: discontinuous synthesis AWAY from fork in Okazaki fragments, each needing its own primer. Okazaki fragments are later joined by DNA ligase. This explains why DNA replication is asymmetric.'},
{id:9,cat:'b',trap:0,q:'What is the role of DNA polymerase I in prokaryotic DNA replication?',a:'DNA polymerase I removes RNA primers using its 5\'→3\' exonuclease activity while simultaneously filling the gap with DNA using its 5\'→3\' polymerase activity. It also has 3\'→5\' proofreading exonuclease activity.',e:'DNA pol I is uniquely bifunctional — it removes AND replaces primers in one pass (nick translation). Without pol I, RNA primers would remain in the final DNA — causing strand breaks and mutations. DNA pol III does the bulk synthesis. DNA pol I does primer replacement. DNA ligase seals the final nick. This three-enzyme coordination ensures accuracy.'},
{id:10,cat:'b',trap:0,q:'List three differences between DNA replication in prokaryotes vs eukaryotes.',a:'1. Origins: prokaryotes have ONE origin (oriC); eukaryotes have MULTIPLE origins (speeds up replication of larger genome). 2. Speed: prokaryotes faster (1000 bp/sec); eukaryotes slower but multiple origins compensate. 3. Chromosomes: prokaryotes circular; eukaryotes linear (require telomerase to replicate ends).',e:'Eukaryotic chromosomes are linear — the "end replication problem": DNA pol cannot fully replicate the very ends. Telomerase adds repetitive sequences (TTAGGG) to chromosome ends (telomeres) to protect genes. Telomerase is active in stem cells and cancer cells — cancer cells use it to achieve immortality. Telomere shortening contributes to aging.'},
{id:11,cat:'c',trap:0,q:'What is transcription and what enzyme performs it?',a:'Transcription = synthesis of RNA from a DNA template. Enzyme: RNA polymerase. In prokaryotes: one RNA polymerase makes all RNA types. In eukaryotes: RNA pol I (rRNA), RNA pol II (mRNA), RNA pol III (tRNA, small RNAs). Process: RNA pol binds promoter → unwinds DNA → synthesizes RNA 5\'→3\' → terminates at terminator.',e:'Prokaryotic RNA polymerase is the target of rifampin (rifampicin) — first-line TB drug. Rifampin blocks the RNA pol beta subunit, preventing transcription initiation. Eukaryotes have multiple specialized RNA polymerases — allows independent regulation of different RNA types. Sigma factor in prokaryotes helps RNA pol recognize promoters (-10 and -35 regions).'},
{id:12,cat:'c',trap:0,q:'Name and describe three types of RNA made by transcription.',a:'mRNA (messenger RNA): carries genetic code from DNA to ribosome for translation. rRNA (ribosomal RNA): structural and catalytic component of ribosomes. tRNA (transfer RNA): adaptor molecule — carries specific amino acid to ribosome, has anticodon matching mRNA codon.',e:'rRNA is the most abundant RNA (80% of total). The ribosome is a ribozyme — its catalytic activity is in the rRNA, not the protein components. tRNA has a cloverleaf 2D structure and L-shaped 3D structure. The anticodon loop pairs with mRNA codon; the acceptor stem carries the amino acid. Aminoacyl-tRNA synthetases charge tRNA with correct amino acid — errors here cause wrong amino acid incorporation.'},
{id:13,cat:'c',trap:1,q:'TRAP: Introns are the coding sequences of eukaryotic genes that are translated into protein. True or false?',a:'FALSE — EXONS are the coding sequences. INTRONS are the intervening non-coding sequences that are spliced out of pre-mRNA before translation.',e:'<b>Exons = expressed (coding). Introns = intervening (non-coding, removed).</b> Memory trick: EXons are EXpressed. INtrons are IN the way. Splicing occurs in the spliceosome (snRNPs). Alternative splicing = different exon combinations → multiple proteins from one gene. Prokaryotes have no introns — transcription and translation are coupled (no splicing needed).'},
{id:14,cat:'c',trap:0,q:'Explain the "triplet code" and "redundancy" as they relate to the genetic code.',a:'Triplet code: each codon (3 nucleotides) specifies one amino acid. 4³ = 64 possible codons for only 20 amino acids. Redundancy (degeneracy): multiple codons code for the same amino acid (e.g., UUU and UUC both = phenylalanine). Only methionine (AUG) and tryptophan (UGG) have single codons.',e:'Redundancy provides a buffer against mutations — many nucleotide changes (especially at the 3rd codon position "wobble position") don\'t change the amino acid (silent/synonymous mutation). The genetic code is nearly universal — same in bacteria, plants, animals (exceptions: mitochondria, some protozoa). This universality enables genetic engineering (express human genes in E. coli).'},
{id:15,cat:'c',trap:0,q:'What is an anticodon, where is it found, and how does it function?',a:'Anticodon = 3-nucleotide sequence on tRNA that base-pairs with complementary codon on mRNA. Located on the anticodon loop (middle loop) of tRNA. Function: ensures correct amino acid is placed at correct position during translation based on mRNA sequence.',e:'Codon-anticodon pairing follows complementary antiparallel base pairing rules (with wobble at 3rd position). If mRNA codon = 5\'-AUG-3\', anticodon = 3\'-UAC-5\'. The aminoacyl-tRNA synthetase enzyme must correctly charge each tRNA with its amino acid — these enzymes are "the second genetic code" ensuring translation fidelity.'},
{id:16,cat:'c',trap:1,q:'TRAP: Translation occurs in the nucleus where mRNA is made. True or false?',a:'FALSE — transcription occurs in the nucleus (eukaryotes). Translation occurs in the CYTOPLASM at ribosomes. mRNA must be exported from the nucleus before translation begins.',e:'<b>Transcription = nucleus (eukaryotes). Translation = cytoplasm (ribosomes).</b> Prokaryotes have no nucleus — transcription and translation occur simultaneously in the cytoplasm (coupled). In eukaryotes, the separation allows: mRNA processing (5\' cap, poly-A tail, splicing) before export. Antibiotics can exploit this difference — some target ribosomal proteins without affecting nuclear transcription.'},
{id:17,cat:'c',trap:0,q:'Compare translation in prokaryotes versus eukaryotes.',a:'Prokaryotes: 70S ribosome (50S + 30S), starts at Shine-Dalgarno sequence, coupled with transcription, fMet initiates, polycistronic mRNA. Eukaryotes: 80S ribosome (60S + 40S), 5\' cap scanning, never coupled with transcription (nuclear barrier), Met initiates, monocistronic mRNA (usually).',e:'Shine-Dalgarno sequence in prokaryotes is ~10 nt upstream of start codon — pairs with 16S rRNA to position ribosome. Eukaryotes scan from 5\' cap for first AUG. Polycistronic mRNA (prokaryotes) encodes multiple proteins in one mRNA — allows coordinated expression of pathway enzymes (operons). These differences make prokaryotic ribosomes selective antibiotic targets.'},
{id:18,cat:'c',trap:0,q:'Compare and contrast inducible and repressible operons.',a:'Inducible operon: normally OFF — inducer molecule (substrate) turns ON transcription by inactivating the repressor. Example: lac operon — lactose (inducer) allows E. coli to express beta-galactosidase only when lactose is present. Repressible operon: normally ON — corepressor molecule (product) turns OFF transcription by activating the repressor. Example: trp operon — tryptophan activates repressor to stop its own synthesis.',e:'Both are negative regulation (repressor protein). Inducible = catabolic pathways (express only when substrate present). Repressible = anabolic pathways (stop making product when enough is present). This allows bacteria to be metabolically efficient. The lac operon is also positively regulated by CAP-cAMP when glucose is absent (catabolite repression).'},
{id:19,cat:'c',trap:1,q:'TRAP: Constitutive genes are expressed only when needed in response to environmental signals. True or false?',a:'FALSE — constitutive genes are ALWAYS expressed regardless of conditions. They encode housekeeping proteins essential for basic cell survival. Facultative genes are regulated (expressed only when needed).',e:'<b>Constitutive = always on. Facultative = regulated (on/off based on conditions).</b> Housekeeping genes (ribosomal proteins, glycolytic enzymes) are constitutive — always needed. Virulence genes in pathogens are often facultative — expressed when entering host (temperature, pH, or nutrient signals trigger expression). Understanding regulation is key to understanding how pathogens adapt to host environment.'},
{id:20,cat:'c',trap:0,q:'What is quorum sensing and what effect does it have on bacteria?',a:'Quorum sensing = chemical communication system allowing bacteria to sense population density. Bacteria secrete autoinducer molecules (acyl-homoserine lactones in Gram-neg, oligopeptides in Gram-pos). When concentration reaches threshold (quorum) → coordinate gene expression: biofilm formation, virulence factor production, antibiotic resistance genes, bioluminescence.',e:'Quorum sensing allows bacteria to "act as a multicellular unit." Virulence genes are often silent at low cell density (would alert immune system) but activate at high density (large population can overwhelm defenses). Disrupting quorum sensing (quorum quenching) is a novel antibiotic strategy that doesn\'t kill bacteria directly — less selective pressure for resistance.'},
{id:21,cat:'d',trap:0,q:'Why would a substitution mutation likely have less impact than a frameshift or deletion mutation?',a:'Substitution = one base changed → may produce silent (same amino acid) or missense (different AA) mutation — one amino acid affected at most. Frameshift (insertion/deletion of non-3 nucleotides) = shifts reading frame → ALL downstream codons changed → non-functional protein.',e:'The redundancy of the genetic code protects against substitutions (many are silent). Frameshift mutations are almost always catastrophic — every codon after the insertion/deletion is wrong. Nonsense mutations (substitution creating stop codon) truncate the protein — severity depends on where in protein the truncation occurs. Cystic fibrosis most common mutation: ΔF508 = deletion of 3 nucleotides → loss of phenylalanine at position 508 → misfolded CFTR protein.'},
{id:22,cat:'d',trap:0,q:'Name three classes of mutagens and how each induces mutations.',a:'1. Chemical mutagens: base analogs (substitute for normal bases — 5-bromouracil), intercalating agents (insert between bases → frameshift — ethidium bromide), alkylating agents (add chemical groups to bases → mispair — nitrogen mustard). 2. Radiation: UV (creates thymine dimers), ionizing radiation (X-rays — strand breaks). 3. Transposons: jumping genes that insert randomly → disrupt genes.',e:'Thymine dimers from UV radiation distort DNA → block replication → mutagenic repair (SOS response → error-prone polymerases). Sunscreen prevents UV damage. Intercalating agents like ethidium bromide (lab stain) are highly mutagenic — handle with caution. Ames test uses Salmonella auxotrophic mutants to detect if chemicals cause mutations (reverse mutation allows growth).'},
{id:23,cat:'d',trap:1,q:'TRAP: The Ames test directly tests whether a chemical causes cancer in humans. True or false?',a:'FALSE — the Ames test uses bacteria (Salmonella typhimurium his− strains) to detect if a chemical causes MUTATIONS (mutagenicity). Mutagenicity correlates with carcinogenicity but is not direct proof of cancer-causing ability in humans.',e:'<b>Ames test = mutagenicity in bacteria, not direct cancer testing.</b> His− Salmonella cannot grow without histidine. Mutagen exposure causes reverse mutation → some bacteria regain ability to make histidine → grow on histidine-free media. More colonies = more mutations = more mutagenic potential. Rat liver extract (S9 fraction) added to mimic human metabolic activation of promutagens.'},
{id:24,cat:'d',trap:0,q:'What are thymine dimers and how do cells deal with them?',a:'Thymine dimers = covalent bonds between adjacent thymines on same DNA strand caused by UV radiation → distort helix, block replication and transcription. Repair: 1. Photoreactivation (light-dependent, photolyase enzyme) — directly reverses dimer 2. Nucleotide excision repair (NER) — cut out dimer and surrounding region, fill and seal.',e:'Xeroderma pigmentosum = inherited defect in NER → extreme UV sensitivity → very high skin cancer risk. The XP proteins are the NER enzymes. SOS response in bacteria = emergency mutagenic repair when damage is overwhelming — error-prone polymerases bypass dimers but introduce mutations. SOS response is why UV light is mutagenic (the bypass is imperfect).'},
{id:25,cat:'d',trap:0,q:'What are plasmids and why are they important in nature and the laboratory?',a:'Plasmids = small, circular, extrachromosomal DNA that replicates independently of the chromosome. Nature: carry resistance genes (R plasmids), virulence factors, metabolic genes — spread by conjugation (horizontal gene transfer). Lab: vectors for cloning and expressing foreign genes (recombinant DNA technology).',e:'R plasmids carrying antibiotic resistance genes spread rapidly through bacterial populations via conjugation. One resistant bacterium can spread resistance to thousands of neighbors in hours. Lab plasmids have been engineered with: multiple cloning sites (MCS), selectable markers (antibiotic resistance to identify transformed cells), and promoters for expressing inserted genes.'},
{id:26,cat:'d',trap:0,q:'Define horizontal gene transfer and explain three mechanisms.',a:'HGT = transfer of genetic material between organisms (not parent to offspring). Mechanisms: 1. Transformation: bacteria take up free DNA from environment (competent cells). 2. Conjugation: direct cell-to-cell transfer via sex pilus (F plasmid-mediated). 3. Transduction: bacteriophage carries bacterial DNA between cells.',e:'HGT is a major driver of bacterial evolution and antibiotic resistance spread. Griffith\'s experiment (1928): heat-killed virulent + live avirulent pneumococcus → live mice died → demonstrated transformation. MRSA spread: mecA gene (methicillin resistance) spread by HGT among Staphylococcus. Carbapenem-resistant Enterobacteriaceae: KPC genes spread via plasmid conjugation across different bacterial species.'},
{id:27,cat:'d',trap:1,q:'TRAP: In conjugation, the F+ cell receives genetic material from the F− cell. True or false?',a:'FALSE — the F+ cell DONATES genetic material to the F− cell. The F+ cell has the F (fertility) plasmid with conjugation genes. The F− cell is the RECIPIENT.',e:'<b>F+ = donor (has F plasmid, makes sex pilus). F− = recipient.</b> After conjugation: F− often becomes F+ (receives a copy of F plasmid). Hfr (high frequency recombination) strains: F integrated into chromosome → transfers chromosomal genes at high frequency, but rarely transfers entire chromosome → F− rarely becomes Hfr. The orientation of F determines which chromosomal genes transfer first.'},
{id:28,cat:'d',trap:0,q:'How does a bacterium with a fertility factor differ from an Hfr strain?',a:'F+ cell: F plasmid is EXTRACHROMOSOMAL → transfers F plasmid to F− recipient (F− becomes F+). Hfr (High frequency recombination) cell: F plasmid is INTEGRATED into the chromosome → transfers chromosomal genes at high frequency → but rarely transfers entire F → recipient remains F− (cannot become Hfr easily).',e:'Hfr strains are used in bacterial genetics to map genes. Which chromosomal genes transfer first depends on where F is integrated and which orientation. The interrupted mating technique (separate cells at different times) maps gene order based on when each gene is transferred (time of entry mapping). Hfr contributed to understanding bacterial chromosome organization.'},
{id:29,cat:'d',trap:0,q:'What are competent cells and how can they alter their genetic makeup?',a:'Competent cells = bacteria capable of taking up free DNA from environment (transformation). Some naturally competent (Streptococcus pneumoniae, Haemophilus influenzae). Others made competent artificially (CaCl2 + heat shock, or electroporation for E. coli in lab).',e:'Natural competence is regulated — Streptococcus becomes competent when stressed (nutrients depleted). Taking up DNA from dead relatives provides nutrients AND potentially useful genes (like antibiotic resistance). Griffith\'s experiment (1928) demonstrated transformation — the "transforming principle" (DNA) was identified by Avery-MacLeod-McCarty (1944). This was one of the first proofs that DNA is the genetic material.'},
{id:30,cat:'d',trap:0,q:'How are specialized and generalized transduction different?',a:'Generalized transduction: lytic phage packages RANDOM bacterial DNA (any fragment that fits) into phage head → delivers to next infected cell. Specialized transduction: lysogenic phage integrates near specific bacterial genes → imprecise excision carries adjacent bacterial genes → only specific genes transferred.',e:'Generalized: any gene can be transferred (random packaging error). Specialized: only genes flanking the phage integration site are transferred. Lambda phage is the classic specialized transduction example — integrates near gal and bio genes → transfers only those genes. Corynebacterium diphtheriae produces diphtheria toxin only because a lysogenic phage carries the tox gene (phage conversion).'},
{id:31,cat:'d',trap:1,q:'TRAP: Transposons are mobile plasmids that transfer between bacteria by conjugation. True or false?',a:'FALSE — transposons ("jumping genes") are mobile DNA elements that move WITHIN or BETWEEN DNA molecules by transposition (cut-and-paste or copy-and-paste). They do NOT transfer between cells by conjugation — they move within the same cell\'s DNA.',e:'<b>Transposons move within DNA by transposition — NOT by conjugation.</b> However, transposons can be on plasmids that DO transfer by conjugation — so resistance genes on transposons can spread that way. Transposons were discovered by Barbara McClintock (Nobel Prize 1983) in maize corn. Insertion of a transposon into a gene disrupts it (insertional mutagenesis). Transposons carry their own transposase enzyme.'},
{id:32,cat:'c',trap:0,q:'What is the general function of reverse transcriptase?',a:'Reverse transcriptase = enzyme that synthesizes DNA from an RNA template (RNA → DNA). Found in: retroviruses (HIV), retrotransposons. Clinical importance: HIV uses reverse transcriptase to convert its RNA genome into DNA for integration. Target of antiretroviral drugs (NRTIs like zidovudine/AZT, NNRTIs like nevirapine).',e:'Reverse transcriptase violates the central dogma\'s one-way flow. It also lacks proofreading activity — makes many errors → HIV mutates rapidly → drug resistance develops quickly → requires combination therapy (HAART). RT-PCR uses reverse transcriptase to convert RNA to cDNA for amplification — used to detect RNA viruses (COVID-19 tests) and measure mRNA expression.'},
{id:33,cat:'c',trap:0,q:'What is post-translational modification and why is it important?',a:'Post-translational modifications (PTMs) = chemical modifications to proteins after translation: phosphorylation (signaling), glycosylation (membrane proteins, antibodies), ubiquitination (targeting for degradation), acetylation (histone regulation), disulfide bond formation (stability).',e:'PTMs dramatically expand protein function diversity — one gene can produce multiple functional forms. Glycosylation of antibodies is essential for immune function. Phosphorylation activates/deactivates enzymes (signal transduction). Ubiquitin tagging by proteasome degrades misfolded proteins. Many drugs target specific PTM enzymes — kinase inhibitors (cancer treatment) target phosphorylation enzymes.'},
{id:34,cat:'a',trap:0,q:'What are riboswitches and how can they impact protein synthesis?',a:'Riboswitches = regulatory sequences in the 5\' UTR of mRNA that bind small molecules (metabolites) directly — no protein needed. When metabolite binds → mRNA changes shape → affects translation initiation (often blocks ribosome binding site) or causes premature transcription termination.',e:'Riboswitches are RNA-based regulatory elements — elegant because the mRNA regulates its own expression. Example: thiamine riboswitch — when thiamine (vitamin B1) is abundant, it binds to mRNA riboswitch → conformation change → blocks translation of thiamine synthesis genes → stops making thiamine. Riboswitches are potential antibiotic targets — they\'re unique to bacteria (no equivalent in humans).'},
{id:35,cat:'a',trap:1,q:'TRAP: DNA methylation always silences gene expression in all organisms. True or false?',a:'FALSE — DNA methylation has DIFFERENT effects in different contexts. In bacteria: methylation distinguishes host DNA from foreign DNA (restriction-modification system). In eukaryotes: methylation of CpG islands in gene promoters typically SILENCES genes (epigenetic silencing). But methylation within gene bodies can be associated with active transcription.',e:'<b>Methylation effects are context-dependent.</b> In bacteria: Dam methylase methylates GATC sequences — mismatch repair recognizes unmethylated (new) strand to correct replication errors. In cancer: hypermethylation silences tumor suppressor genes. Demethylation can reactivate silenced genes — epigenetic therapy concept (azacitidine demethylates DNA → reactivates tumor suppressors).'},
{id:36,cat:'d',trap:0,q:'What are spontaneous mutations, how do they arise, and how do they contribute to evolution?',a:'Spontaneous mutations = mutations occurring without external mutagen. Sources: 1. Tautomeric shifts (bases in rare forms → mispair during replication) 2. Depurination (loss of purine base → gap) 3. Deamination (cytosine → uracil) 4. Slipped-strand mispairing (repeated sequences). Contribute to evolution: provide raw genetic variation — most harmful but rare beneficial mutations are selected for.',e:'Spontaneous mutation rate in bacteria: ~10⁻⁹ per base pair per replication. With 10⁶-10⁹ cells growing rapidly, random mutations constantly arise. Most are neutral or harmful. Rare beneficial mutations (antibiotic resistance, new metabolic capabilities) are selected under appropriate conditions. Antibiotic resistance can pre-exist in a population before antibiotic exposure — selection reveals it, does not create it.'},
{id:37,cat:'c',trap:0,q:'What is small noncoding RNA (sRNA) and how does it affect protein synthesis?',a:'sRNAs = short RNA molecules (~50-250 nt) that regulate gene expression post-transcriptionally. Mechanisms: 1. Base-pair with mRNA target → block ribosome binding → inhibit translation 2. Base-pair with mRNA → recruit RNase → degrade mRNA 3. Titrate regulatory proteins. Examples: microRNAs (eukaryotes), siRNAs (eukaryotes), regulatory sRNAs (prokaryotes).',e:'sRNAs allow rapid, energy-efficient regulation — modulating translation without new transcription. Eukaryotic miRNAs regulate ~60% of human genes. siRNA technology (RNA interference/RNAi) won the 2006 Nobel Prize — used to silence any gene experimentally and in gene therapy. Some pathogens (viruses, some bacteria) encode sRNAs that manipulate host gene expression.'},
{id:38,cat:'b',trap:0,q:'What are the three eukaryotic RNA polymerases and what does each make?',a:'RNA Pol I: transcribes rRNA genes (in nucleolus) — makes 28S, 18S, 5.8S rRNA. RNA Pol II: transcribes protein-coding genes — makes pre-mRNA, also snRNAs. RNA Pol III: transcribes tRNA genes and 5S rRNA — makes small stable RNAs.',e:'RNA Pol II is the most complex and most regulated — it transcribes all mRNA genes. Alpha-amanitin (from death cap mushroom) specifically inhibits RNA pol II — causes liver failure. Prokaryotes have one RNA polymerase for all RNA types. This eukaryotic specialization allows independent regulation — you can shut down only mRNA synthesis without affecting rRNA/tRNA production.'},
{id:39,cat:'b',trap:1,q:'TRAP: DNA polymerase can begin DNA synthesis on any single-stranded DNA template without any assistance. True or false?',a:'FALSE — DNA polymerase CANNOT initiate new strands. It requires a pre-existing 3\'-OH group (provided by an RNA primer synthesized by primase) to begin adding nucleotides.',e:'<b>DNA pol = extension only, cannot initiate. Primase = initiation (makes RNA primer providing 3\'-OH).</b> This limitation is fundamental to DNA replication. The RNA primer requirement creates the "end replication problem" for linear chromosomes — the very 3\' end of the lagging strand cannot be primed → telomerase is needed to maintain chromosome length in eukaryotes.'},
{id:40,cat:'d',trap:0,q:'What are retrotransposons and how do they differ from DNA transposons?',a:'DNA transposons: move by cut-and-paste mechanism (transposase cuts out element, inserts elsewhere) — move without making a copy (conservative). Retrotransposons: move by copy-and-paste through RNA intermediate (transcribed to RNA → reverse transcription to DNA → integration) — increase in copy number (replicative). Similar to retroviruses but stay in same cell.',e:'Retrotransposons are essentially genome parasites that replicate themselves. LINEs (Long Interspersed Nuclear Elements) and SINEs (Short INEs) are retrotransposons comprising ~45% of human genome. DNA transposons comprise ~3%. Most are silenced by DNA methylation. They cause disease when inserting into genes (hemophilia cases caused by LINE insertion into Factor VIII gene).'},
{id:41,cat:'c',trap:0,q:'What is post-transcriptional regulation and give an example.',a:'Post-transcriptional regulation = controlling gene expression AFTER transcription but BEFORE or DURING translation. Examples: mRNA stability (3\'-UTR elements determine mRNA half-life), RNA interference (miRNA/siRNA degrade or block translation of mRNA), riboswitches (mRNA secondary structure blocks translation), RNA editing (change nucleotide sequence of mRNA after transcription).',e:'mRNA stability is a powerful regulatory mechanism. Some mRNAs last seconds (rapid response genes), others days (stable proteins). AU-rich elements (AREs) in 3\'-UTR destabilize mRNA. Cytokine mRNAs have AREs — rapid turnover prevents sustained inflammation. RNAi technology exploits this — introduced dsRNA is processed to siRNA → guides RISC complex to cleave target mRNA.'},
{id:42,cat:'d',trap:0,q:'Why were transposons such a revolutionary discovery in genetics?',a:'Barbara McClintock\'s discovery (1940s-50s) overturned the view that genomes are static. Transposons showed genomes are DYNAMIC — genes move, rearrange, and can disrupt other genes. This explained genetic instability in corn kernels. Led to understanding: insertional mutagenesis, genome evolution, antibiotic resistance spread, and gene therapy using transposon-based vectors.',e:'McClintock received the Nobel Prize in 1983, decades after her discovery — initially dismissed by the scientific community. Transposons now recognized as drivers of genome evolution. ~80% of maize genome is transposon-derived. "Junk DNA" in humans largely consists of transposon remnants. Mobile elements can carry genes (including resistance genes) between different locations — antibiotic resistance plasmids often have transposon-carried resistance genes.'},
{id:43,cat:'c',trap:0,q:'What is transcription factor regulation and why is it important in eukaryotes?',a:'Transcription factors (TFs) = proteins that bind specific DNA sequences (enhancers, promoters) and regulate RNA pol II activity. General TFs: required for all transcription (TFIID, TFIIH). Specific TFs: tissue-specific expression of particular genes. TFs interact with mediator complex and RNA pol II to activate or repress transcription.',e:'TFs explain why genetically identical cells in different tissues express different genes (cell differentiation). Mutations in TFs cause developmental disorders and cancers. p53 = tumor suppressor TF — mutated in ~50% of cancers. Steroid hormones (estrogen, testosterone) are ligand-activated TFs — explains why hormone levels affect gene expression. Many cancer drugs target TFs.'},
{id:44,cat:'a',trap:0,q:'What is feedback inhibition and how does it help cells live more efficiently?',a:'Feedback inhibition = the end product of a metabolic pathway inhibits an enzyme early in that pathway (usually the first committed step). This prevents overproduction of the product. Example: threonine inhibits threonine deaminase (first step in isoleucine synthesis) when isoleucine is abundant.',e:'Feedback inhibition operates at the protein level (allosteric regulation) — immediate, without new gene expression. The inhibitor binds an allosteric site (not the active site) → changes enzyme conformation → reduces activity. Much faster than transcriptional regulation. Antibiotics can mimic feedback inhibitors — sulfonamides mimic PABA (substrate) to inhibit folate synthesis.'},
{id:45,cat:'b',trap:0,q:'What are topoisomerases and why are they needed during DNA replication?',a:'Topoisomerases = enzymes that change DNA topology by transiently cutting DNA strands. During replication: helicase unwinding creates positive supercoils (overwinding) ahead of the fork. Topoisomerases relieve this tension — Type I (cut one strand), Type II (cut both strands, including Gyrase/Topoisomerase II).',e:'Without topoisomerase, overwinding ahead of the replication fork would halt replication. DNA gyrase (bacterial type II topoisomerase) is the target of fluoroquinolone antibiotics (ciprofloxacin, levofloxacin) — highly effective broad-spectrum antibiotics. Eukaryotic topoisomerase II is targeted by cancer drugs (etoposide, doxorubicin) — tumor cells dividing rapidly are preferentially killed.'},
{id:46,cat:'c',trap:0,q:'What are the three sites in the ribosome and what occurs at each during translation?',a:'A (aminoacyl) site: incoming charged tRNA (carrying next amino acid) enters. P (peptidyl) site: holds tRNA carrying growing peptide chain — peptide bond formation occurs here. E (exit) site: empty tRNA (deaminoacylated) exits before leaving ribosome.',e:'Translocation moves ribosome 3 nucleotides (one codon) in 5\'→3\' direction: A→P, P→E, E→out. Peptidyl transferase (rRNA ribozyme) catalyzes peptide bond in P site. Many antibiotics target specific ribosome sites: aminoglycosides (30S A site — misreading), tetracycline (30S A site — blocks tRNA entry), chloramphenicol (50S peptidyl transferase), erythromycin (50S — blocks translocation).'},
{id:47,cat:'d',trap:1,q:'TRAP: Antibiotic resistance genes in bacteria must be present BEFORE antibiotic exposure — antibiotics CREATE resistance through directed mutations. True or false?',a:'FALSE — antibiotics NEVER create resistance. They SELECT for pre-existing resistance. Rare resistant mutants exist in any bacterial population by chance. When antibiotics kill sensitive cells, resistant ones survive and reproduce — increasing their proportion. Antibiotics select, not create.',e:'<b>Antibiotics select for pre-existing resistance — they do not induce it.</b> This is fundamental to understanding antibiotic resistance evolution. Resistance mutations arise constantly by random mutation at low frequency (~10⁻⁹ per base pair per generation). Before antibiotics were widely used, resistance genes already existed in soil bacteria (confirmed by sequencing ancient permafrost bacteria). Inappropriate antibiotic use accelerates selection of resistant strains.'},
{id:48,cat:'c',trap:0,q:'What is the 5\' cap and poly-A tail of eukaryotic mRNA and what do they do?',a:'5\' cap: 7-methylguanosine cap added to 5\' end co-transcriptionally. Functions: protection from 5\' exonucleases, ribosome recognition for translation initiation, nuclear export signal. Poly-A tail: 100-250 adenine residues added to 3\' end by poly-A polymerase. Functions: mRNA stability (protection from 3\' degradation), nuclear export, translation efficiency.',e:'Both modifications protect mRNA and enhance its translation. mRNA without 5\' cap or poly-A tail is rapidly degraded. This is why mRNA vaccines (COVID-19) required these modifications to stabilize the therapeutic mRNA long enough to be translated. Prokaryotic mRNAs lack both modifications — explains their shorter half-lives (seconds to minutes vs. hours in eukaryotes).'},
{id:49,cat:'b',trap:0,q:'What is helicase and what role does it play in DNA replication?',a:'Helicase = enzyme that unwinds the double helix at the replication fork by breaking hydrogen bonds between base pairs. In prokaryotes: DnaB helicase loads at origin after DnaA initiator protein opens the double helix. Requires ATP. Creates two single-stranded templates for polymerases.',e:'Helicase moves ahead of the replication fork, powered by ATP hydrolysis. SSB (single-stranded DNA binding proteins) coat the unwound strands to prevent re-annealing and protect from nucleases. Primase binds to helicase (forms the primosome) — coordinates primer synthesis with strand unwinding. Helicase is a potential antibiotic target (very different from eukaryotic helicases).'},
{id:50,cat:'d',trap:0,q:'How does Griffith\'s fourth experimental scenario demonstrate transformation?',a:'Griffith injected: 1. Live rough (R) avirulent pneumococcus → mice lived. 2. Live smooth (S) virulent → mice died. 3. Heat-killed S → mice lived. 4. Heat-killed S + live R → mice DIED and live virulent S was recovered. The "transforming principle" from dead S cells transformed live R cells into virulent S cells.',e:'This was revolutionary — genetic material could be transferred between organisms. Avery, MacLeod, and McCarty (1944) identified the transforming principle as DNA (not protein, as many scientists assumed). This was one of the first proofs that DNA carries genetic information. The transformed bacteria had permanently acquired the smooth capsule gene — transformation is heritable.'},
];
let ans={};let cf='all';
function render(){
  const fl=cf==='all'?Q:cf==='t'?Q.filter(q=>q.trap):Q.filter(q=>q.cat===cf);
  const g=document.getElementById('grid');g.innerHTML='';
  fl.forEach(q=>{
    const tc=q.cat==='a'?'ta':q.cat==='b'?'tb':q.cat==='c'?'tc':q.cat==='d'?'td':'tt';
    const tl=q.cat==='a'?'DNA Structure':q.cat==='b'?'Replication':q.cat==='c'?'Gene Expression':q.cat==='d'?'Mutations/HGT':'Exam Trap';
    const d=document.createElement('div');d.className='qcard';
    d.innerHTML=`<div class="qh"><span class="qn">Q${String(q.id).padStart(2,'0')}</span><div class="qt">${q.q}${q.trap?'<span class="trap-pill">⚠ Trap</span>':''}</div><span class="qtag ${tc}">${tl}</span></div><div class="qans"><div class="al">Answer</div><div class="at">${q.a}</div></div><div class="qexp"><div class="el">Why it matters</div><div class="et">${q.e}</div></div>`;
    g.appendChild(d);
  });
  document.getElementById('sr').textContent=50-Object.keys(ans).length;
}
function filt(c,btn){cf=c;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function resetAll(){ans={};render();}
render();
</script>
