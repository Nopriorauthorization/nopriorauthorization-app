<script>
const Q=[
{id:1,cat:'a',trap:0,q:'What is the primary reason viruses are NOT considered alive?',a:'Viruses cannot reproduce independently — they require a host cell\'s metabolic machinery (ribosomes, enzymes, ATP, amino acids) to replicate. They have no metabolism of their own, cannot carry out homeostasis, and do not grow.',e:'The definition of life requires: metabolism, reproduction, homeostasis, response to stimuli, growth. Viruses fail most of these outside a host. However, inside a host they hijack all cellular machinery. This is why viruses are called "obligate intracellular parasites." It\'s also why antiviral drugs are hard to design — targeting viral processes often hits host cell processes too.'},
{id:2,cat:'a',trap:0,q:'Describe the features and functions of viral capsids, spikes, and envelopes.',a:'Capsid: protein coat surrounding viral nucleic acid — made of capsomeres (protein subunits). Functions: protects nucleic acid, determines shape (icosahedral/helical/complex), host cell recognition. Envelope: lipid bilayer derived from host cell membrane — present in enveloped viruses. Spikes (peplomers): glycoproteins projecting from envelope — mediate host cell attachment and entry.',e:'Capsid geometry: icosahedral (20 faces — poliovirus, adenovirus), helical (tobacco mosaic virus, influenza), complex (bacteriophages with head + tail, poxviruses). Envelope is derived from host nuclear, ER, or plasma membrane — contains viral glycoproteins. Naked (non-enveloped) viruses survive harsher conditions (stomach acid, drying) — fecal-oral route transmission. Enveloped viruses are more fragile but better at evading immunity.'},
{id:3,cat:'a',trap:1,q:'TRAP: Bacteriophages can have either a naked or enveloped capsid. True or false?',a:'FALSE — bacteriophages are ALWAYS naked (non-enveloped). They never have lipid envelopes. They acquire their envelopes from host cell membranes during budding — but bacteria have no membrane for phages to acquire.',e:'<b>Bacteriophages = always naked. Animal viruses can be enveloped or naked.</b> Enveloped viruses acquire their lipid bilayer as they bud from the host cell (plant/animal). Bacterial cells can be lysed but do not bud — bacteriophages must use lytic or lysogenic cycles without acquiring an envelope. This distinction is frequently tested.'},
{id:4,cat:'a',trap:0,q:'What are the possible genomic variations for viruses?',a:'DNA viruses: dsDNA (most), ssDNA (+/-). RNA viruses: dsRNA (rotavirus), ssRNA positive-sense (+) = acts directly as mRNA, ssRNA negative-sense (−) = complement of mRNA must be copied first, ssRNA retroviruses (reverse transcribed to DNA). Genomes can be segmented (influenza — 8 segments) or non-segmented.',e:'Positive-sense RNA = ready to translate immediately upon entry (like mRNA). Negative-sense RNA = must first be transcribed to positive-sense by RNA-dependent RNA polymerase brought in with the virus. Segmented genomes enable antigenic shift (reassortment) when two influenza strains coinfect same cell — different segment combinations create new viruses. Explains pandemic influenza emergence.'},
{id:5,cat:'a',trap:1,q:'TRAP: RNA viruses evolve faster than DNA viruses primarily because they reproduce faster. True or false?',a:'FALSE — RNA viruses evolve faster because RNA polymerases LACK PROOFREADING activity, leading to mutation rates 10⁴-10⁶x higher than DNA polymerases (which have proofreading). Rapid reproduction contributes but the key is error rate.',e:'<b>RNA pol = no proofreading = high mutation rate = rapid evolution.</b> HIV mutates so rapidly that drug-resistant variants arise within days of starting therapy — why combination therapy (HAART) is needed. Influenza evolves rapidly → new vaccines needed annually (antigenic drift). This high mutation rate is a double-edged sword: generates diversity but also produces many non-viable variants.'},
{id:6,cat:'a',trap:0,q:'Define antigenic shift and antigenic drift for influenza and explain their clinical impact.',a:'Antigenic drift: gradual accumulation of point mutations in surface proteins (HA, NA) → small changes → seasonal epidemics → annual vaccine update needed. Antigenic shift: sudden major change from reassortment of gene segments between two strains (requires coinfection of same cell) → new subtype → pandemic potential (no pre-existing immunity in population).',e:'H1N1 "Spanish flu" (1918), H2N2 "Asian flu" (1957), H3N2 "Hong Kong flu" (1968), H1N1 "Swine flu" (2009) — all resulted from antigenic shift. Pigs are "mixing vessels" — infected by both avian and human influenza → coinfection → reassortment → novel pandemic strains. Antigenic drift explains why you need annual flu shots even if vaccinated last year.'},
{id:7,cat:'b',trap:0,q:'Compare and contrast lytic and lysogenic bacteriophage replication.',a:'Lytic: phage injects DNA → immediately hijacks cell → makes new phages → cell lyses and releases phages. Lysogenic: phage DNA integrates into host chromosome as prophage → replicates with host → no immediate lysis → can be induced to enter lytic cycle by stress.',e:'The choice between lytic and lysogenic depends on the multiplicity of infection and host cell health. Lysogeny allows phage survival when host cells are scarce. Induction: UV light, chemicals trigger prophage excision → enters lytic cycle. Phage conversion = prophage genes change bacterial phenotype (C. diphtheriae: tox gene from phage makes diphtheria toxin; Vibrio cholerae: cholera toxin gene on phage).'},
{id:8,cat:'b',trap:1,q:'TRAP: During lysogeny, the bacteriophage actively produces viral proteins while integrated as a prophage. True or false?',a:'FALSE — during lysogeny, the prophage is largely SILENT. Most phage genes are repressed by the CI repressor protein. Only genes needed for integration and repressor maintenance are expressed. The phage replicates WITH the host chromosome passively.',e:'<b>Prophage = dormant/silent (mostly). Must be induced to become active.</b> The lambda repressor (CI protein) represses lytic genes. Induction (SOS response to DNA damage) inactivates CI → lytic genes expressed → prophage excises → lytic cycle begins. Prophage silencing explains why lysogenic bacteria appear normal — the phage hides from immune detection by staying silent.'},
{id:9,cat:'b',trap:0,q:'What are the steps of animal virus replication?',a:'1. Attachment (viral spike to host receptor) 2. Entry/penetration (endocytosis or membrane fusion) 3. Uncoating (capsid removal, genome release) 4. Biosynthesis (genome replication + viral protein synthesis) 5. Maturation/Assembly (new virions assembled) 6. Release (lysis or budding)',e:'Enveloped viruses: enter by membrane fusion (HIV, influenza) or receptor-mediated endocytosis. Release by budding (acquiring envelope). Naked viruses: enter by endocytosis. Release by cell lysis (kills host cell). HIV: entry via CD4+CCR5/CXCR4 receptors → reverse transcription → integration → latency possible → activation → budding. Each step is a potential antiviral drug target.'},
{id:10,cat:'b',trap:0,q:'How does the presence or absence of a viral envelope impact entry and release?',a:'Enveloped viruses: entry by membrane fusion (direct fusion with plasma membrane) or endocytosis → escape endosome via membrane fusion. Release by budding (acquire envelope from host membrane — does not immediately kill cell). Naked viruses: entry by endocytosis → escape by disrupting endosomal membrane. Release by cell lysis (kills cell).',e:'Enveloped viruses (HIV, influenza, herpes) are more fragile — envelope disrupted by heat, soap, alcohol. Naked viruses (poliovirus, norovirus, adenovirus) survive GI tract → fecal-oral transmission. This explains why soap destroys COVID-19 (enveloped) but hand sanitizer is less effective against norovirus (naked). Membrane fusion inhibitors (enfuvirtide) target HIV entry.'},
{id:11,cat:'b',trap:0,q:'Compare and contrast latent and chronic viral infections.',a:'Latent: virus hides in host cells (often nerve cells), no active replication, no symptoms — can reactivate. Examples: herpes simplex (cold sores), varicella-zoster (shingles), HIV. Chronic: persistent low-level replication with ongoing viral production — can cause ongoing damage. Examples: hepatitis B, hepatitis C, HIV (also).',e:'Herpes simplex: primary infection → latency in trigeminal ganglion → stress/immune suppression triggers reactivation → cold sore (same dermatomal distribution). HIV can be both latent (integrated provirus in resting T cells) and chronic (continuous low-level replication). Latency is why herpes is incurable — immune system cannot see dormant virus. Antivirals suppress replication but cannot eradicate latent reservoirs.'},
{id:12,cat:'b',trap:1,q:'TRAP: Phage conversion occurs when a bacteriophage infects and kills a bacterium, converting its components into new phages. True or false?',a:'FALSE — phage conversion = a LYSOGENIC phage changes bacterial PHENOTYPE by contributing genes from the prophage. The bacterium survives and gains new characteristics (toxin production, new surface antigens).',e:'<b>Phage conversion = prophage genes modify bacterial phenotype.</b> Examples: Corynebacterium diphtheriae produces diphtheria toxin ONLY if infected by β-phage (tox gene). Streptococcus pyogenes produces erythrogenic toxin (scarlet fever) from prophage genes. Vibrio cholerae cholera toxin from CTX phage. These bacteria are made MORE virulent by their prophage — and the phage genes spread through bacterial populations via lysogeny.'},
{id:13,cat:'b',trap:0,q:'What is the plaque assay and what information does it reveal?',a:'Plaque assay = technique for quantifying infectious viruses. Viruses mixed with bacterial lawn (for phages) or cell monolayer (animal viruses) → clear zones (plaques) form where virus killed cells → each plaque = one infectious viral particle (PFU = plaque-forming unit). Calculates viral titer (PFU/mL).',e:'Plaque assay allows: 1. Quantification (how many infectious particles per mL). 2. Isolation of individual viral strains (pick a plaque). 3. Assessment of antiviral drug efficacy (PRNT — plaque reduction neutralization test). One plaque = one original infectious virus that spread to neighboring cells. Clear zones = cell death. Turbid plaques (lysogeny) vs. clear plaques (lytic) helps identify phage cycle.'},
{id:14,cat:'a',trap:0,q:'What are prions and what diseases do they cause?',a:'Prions = misfolded proteins (PrP^Sc) that convert normal PrP^C proteins into misfolded form — no nucleic acid. Diseases: Creutzfeldt-Jakob disease (CJD), variant CJD (vCJD from mad cow disease), kuru, Gerstmann-Sträussler-Scheinker syndrome, fatal familial insomnia, scrapie (sheep), bovine spongiform encephalopathy (BSE).',e:'Prions represent a 3rd class of infectious agent (non-cellular, no nucleic acid). The misfolded PrP^Sc is resistant to proteases, heat, formaldehyde, and radiation. Normal brain PrP^C → contact with PrP^Sc → conformational change → chain reaction → aggregates → spongiform brain damage. Untreatable. Stanley Prusiner won 1997 Nobel Prize for discovering prions. Sterilization by autoclave must use longer cycles for prion decontamination.'},
{id:15,cat:'b',trap:1,q:'TRAP: Iatrogenic CJD and variant CJD are both contracted by eating contaminated beef. True or false?',a:'FALSE — variant CJD is contracted from eating BSE-contaminated beef. Iatrogenic CJD is acquired via MEDICAL PROCEDURES (contaminated surgical instruments, dura mater grafts, corneal transplants, growth hormone from cadavers).',e:'<b>vCJD = mad cow beef. Iatrogenic CJD = medical contamination.</b> Sporadic CJD: spontaneous misfolding (~85% of cases). Familial CJD: inherited mutation in PRNP gene. Iatrogenic CJD: contaminated neurosurgical equipment (prions resist standard sterilization), cadaveric growth hormone, pituitary-derived FSH. This is why surgical instruments used on suspected CJD patients are destroyed rather than reprocessed.'},
{id:16,cat:'c',trap:0,q:'Define binary fission and compare it to budding and spore formation.',a:'Binary fission: one cell divides into two identical daughter cells (most bacteria). Budding: asymmetric growth — small "bud" forms and pinches off (yeast, some bacteria like Hyphomicrobium). Spore formation: differentiation into resistant structures — endospores (survival, not reproduction in bacteria), asexual spores in fungi (reproduction).',e:'Binary fission = all bacteria, asexual, produces identical cells, generation time is the measurement. Budding in yeast: daughter cell is smaller initially, grows to full size. Budding allows yeast to produce more generations per unit time in some conditions. Note: viral budding is completely different — it\'s how enveloped viruses leave cells by acquiring envelope from host membrane.'},
{id:17,cat:'c',trap:0,q:'What would the generation time be for an organism that goes through 5 generations in 150 minutes?',a:'Generation time = total time ÷ number of generations = 150 ÷ 5 = 30 minutes per generation.',e:'Generation time formula: g = t/n (g = generation time, t = total time, n = number of generations). Alternatively: n = (log N_final - log N_initial) / log 2 to calculate number of generations. E. coli: ~20 min. M. tuberculosis: 12-24 hours (explains why TB treatment takes months). Knowing generation time allows prediction of population growth and antibiotic treatment duration.'},
{id:18,cat:'c',trap:0,q:'Name and describe the four phases of bacterial growth in a closed batch system.',a:'1. Lag phase: no growth — cells adapting, making enzymes, increasing in size. 2. Log (exponential) phase: maximum growth rate — cells dividing at constant rate. 3. Stationary phase: growth rate = death rate — nutrients depleted, waste accumulates. 4. Death phase: death rate exceeds growth rate — population declines.',e:'Cells in log phase are most metabolically active — best time to test antibiotics (many target actively dividing cells). Stationary phase cells upregulate stress responses and survival mechanisms. Lag phase is not "no activity" — cells are preparing for growth. Cryptic growth can occur in death phase (dead cells provide nutrients for survivors). Bacteria in nature rarely experience true log phase — nutrients are limiting.'},
{id:19,cat:'c',trap:1,q:'TRAP: The lag phase of bacterial growth represents a period when bacteria are dying from the stress of being placed in new media. True or false?',a:'FALSE — in the lag phase bacteria are ALIVE and ACTIVE but not yet dividing rapidly. They are synthesizing enzymes needed to metabolize available nutrients, repairing any DNA damage, and increasing in cell size.',e:'<b>Lag phase = metabolic preparation, not death or dormancy.</b> If bacteria are transferred from rich to minimal media: they need to synthesize new enzymes for new metabolic requirements → longer lag phase. Same media: short lag phase. Understanding lag phase matters for: food safety (contamination → lag before exponential growth), laboratory cultures (allow sufficient lag time before adding antibiotics), and infection (lag phase before symptoms appear).'},
{id:20,cat:'d',trap:0,q:'How do the terms optimal, minimum, and maximum apply to temperature and pH conditions?',a:'Optimal: conditions allowing maximum growth rate. Minimum: lowest temperature/pH at which growth occurs (below → no growth). Maximum: highest temperature/pH at which growth occurs (above → no growth). The range between min and max defines the organism\'s tolerance. Cardinal temperatures apply specifically to temperature ranges.',e:'E. coli: min 10°C, optimal 37°C, max 45°C (mesophile). Thermus aquaticus (Taq polymerase source): optimal 70°C (thermophile). pH: most bacteria: pH 6.5-8.5 (neutralophiles). Stomach: pH 1.5-3.5 — most bacteria killed. H. pylori optimal pH 6-7 but survives in stomach by producing urease (neutralizes local pH). Cardinal temperatures explain food storage rules (refrigeration slows mesophile growth).'},
{id:21,cat:'d',trap:0,q:'Using temperature classification terms, describe microbes in a deep-sea hydrothermal vent, human intestinal tract, and beneath a glacier.',a:'Hydrothermal vent (>100°C, some >400°C): hyperthermophiles (optimal >80°C — Pyrolobus fumarii, optimal 121°C). Human intestine (~37°C): mesophiles (optimal 25-40°C — E. coli, optimal 37°C). Beneath glacier (−2 to 4°C): psychrophiles or psychrotrophs (optimal <15°C or grow at cold temps).',e:'Taq polymerase from Thermus aquaticus revolutionized PCR — heat-stable enzyme survives denaturation step (95°C). Hyperthermophile enzymes are studied for industrial applications (laundry detergent enzymes active in hot wash). Psychrophiles in Arctic/Antarctic produce cold-active enzymes — important for food processing at low temperatures. Psychrotrophs (like Listeria) grow in refrigerators — food safety concern.'},
{id:22,cat:'d',trap:1,q:'TRAP: All bacteria that are aerobic require the same concentration of oxygen for growth. True or false?',a:'FALSE — oxygen requirements vary significantly. Obligate aerobes require O2. Microaerophiles require LOW O2 (2-10% — Helicobacter pylori, Campylobacter). Obligate anaerobes are KILLED by O2. Facultative anaerobes PREFER O2 but grow without it. Aerotolerant anaerobes tolerate O2 but don\'t use it.',e:'<b>Oxygen classification is nuanced — microaerophiles, facultative, obligate aerobes all need "oxygen" but in very different amounts.</b> H. pylori is microaerophilic — standard atmospheric O2 is toxic. This is why culturing Campylobacter requires special microaerophilic chambers (5% O2, 10% CO2, 85% N2). Oxygen toxicity in anaerobes: O2 generates reactive oxygen species (superoxide, peroxide) — anaerobes lack catalase/superoxide dismutase to neutralize them.'},
{id:23,cat:'d',trap:0,q:'Name the various classes of microbes according to oxygen use and explain why oxygen is toxic to anaerobes.',a:'Obligate aerobe: requires O2 (has SOD + catalase). Obligate anaerobe: killed by O2, no SOD/catalase. Facultative anaerobe: prefers O2 but can ferment/anaerobic respire without it. Microaerophile: requires low O2 (<10%). Aerotolerant anaerobe: O2 present but not used — has SOD but no catalase.',e:'O2 toxicity mechanism: O2 → superoxide (O2−) via electron leakage → hydrogen peroxide (H2O2) via superoxide dismutase (SOD) → hydroxyl radical (OH•) most toxic via Fenton reaction. Obligate anaerobes lack SOD → cannot neutralize superoxide → oxidative damage → death. Clinical note: wounds with poor blood supply (necrotic tissue, diabetic foot) become anaerobic → Clostridium perfringens (gas gangrene) or Bacteroides infections. Treatment requires wound debridement + oxygen (hyperbaric O2).'},
{id:24,cat:'d',trap:0,q:'Define acidophile, alkaliphile, and neutralophile. How might microbes adapt to pH extremes?',a:'Neutralophile: optimal pH 6-8 (most bacteria, human pathogens). Acidophile: optimal pH <5 (Acidithiobacillus — acid mine drainage, pH 1-2). Alkaliphile: optimal pH >9 (Halobacterium, Soda lake bacteria, pH 10-12). Adaptations: modified cell wall composition, specialized membrane lipids, ion pumps to maintain internal neutral pH.',e:'Even acidophiles maintain internal pH near neutral — they actively pump out H+ ions. Cell wall and membrane adaptations prevent proton entry. Helicobacter pylori is not a true acidophile — it creates a protected microenvironment by producing urease (urea → NH3 + CO2 → neutralizes local pH). Dental caries: Streptococcus mutans is acid-tolerant — produces lactic acid from sugar fermentation → acidic environment damages tooth enamel.'},
{id:25,cat:'d',trap:0,q:'What are halophiles and what adaptations help them manage osmotic stress?',a:'Halophiles = microorganisms that require or tolerate high salt concentrations. Extreme halophiles: require >15% NaCl (Dead Sea, Great Salt Lake). Adaptations: 1. Accumulate compatible solutes (glycine betaine, ectoine) inside cell to balance osmotic pressure 2. Modified proteins stable in high salt 3. Modified membranes for salt stability.',e:'Compatible solutes are small organic molecules that accumulate in cytoplasm to balance osmotic pressure without interfering with cell metabolism. These same adaptations are studied for: preserving enzymes/cells in lab, developing salt-tolerant crops, making stress-resistant probiotics. Osmotic stress by salting food (curing, brining) exploits the principle that most pathogens are not halophilic — they lose water → die.'},
{id:26,cat:'d',trap:1,q:'TRAP: Pasteurization sterilizes milk by killing all microorganisms. True or false?',a:'FALSE — pasteurization is DISINFECTION, not sterilization. It kills most pathogens and many spoilage organisms but does NOT kill all microorganisms (especially endospores). Purpose: eliminate specific pathogens (Mycobacterium bovis, Salmonella, Listeria, Brucella).',e:'<b>Pasteurization = disinfection (reduces pathogens). Sterilization = kills ALL life.</b> HTST pasteurization: 72°C for 15 seconds. UHT (ultra-high temperature): 138°C for 2 seconds → commercially sterile (kills vegetative cells + most spores, extends shelf life significantly). Sterilization requires autoclave (121°C, 15 min) or UHT extended. This distinction matters for food safety and clinical settings.'},
{id:27,cat:'d',trap:0,q:'What is the difference between bacteriostatic and bactericidal agents?',a:'Bacteriostatic: inhibits bacterial GROWTH but does not kill — bacteria resume growth when agent removed. Immune system must finish the job. Bactericidal: KILLS bacteria (reduces viable count by ≥99.9%). Bacteriolytic: kills AND lyses cells. Choice depends on clinical situation — immunocompromised patients need bactericidal drugs.',e:'Most antibiotics are one or the other but some can be both depending on concentration (concentration-dependent bactericidal drugs). Tetracyclines = bacteriostatic (block protein synthesis → growth stops). Fluoroquinolones = bactericidal (damage DNA → cell death). In immunocompromised patients (HIV, transplant recipients, neutropenic cancer patients): bacteriostatic drugs may be insufficient — immune system cannot clear inhibited bacteria. Use bactericidal agents.'},
{id:28,cat:'d',trap:0,q:'What are the levels of germicide activity and which are used for critical, semicritical, and noncritical equipment?',a:'High-level: kills all organisms except high numbers of endospores — used on semicritical items (endoscopes, laryngoscope blades). Intermediate-level: kills vegetative bacteria, fungi, viruses, some endospores — noncritical items with visible blood. Low-level: kills vegetative bacteria, some fungi/viruses — noncritical items (blood pressure cuffs, stethoscopes). Critical items (surgical instruments): require sterilization.',e:'Spaulding classification: Critical (enters sterile tissue) = sterilization required. Semicritical (contacts mucous membranes) = high-level disinfection minimum. Noncritical (contacts intact skin only) = low-level disinfection. Improper disinfection level → healthcare-acquired infections. CJD prions require destruction of critical items (cannot be reprocessed safely).'},
{id:29,cat:'d',trap:1,q:'TRAP: Alcohols are the most effective germicides because they kill endospores rapidly. True or false?',a:'FALSE — alcohols are intermediate-level germicides that do NOT effectively kill endospores. They kill vegetative bacteria, fungi, and lipid-enveloped viruses by denaturing proteins and disrupting membranes.',e:'<b>Alcohols (isopropyl, ethyl) = good against vegetative cells and enveloped viruses, NOT endospores.</b> This is clinically significant: Clostridium difficile spreads via endospores — alcohol hand sanitizer is INEFFECTIVE against C. diff. Healthcare workers must use soap and water (mechanical removal of spores) for C. diff contacts. Endospores require: hypochlorite bleach, glutaraldehyde, or sterilization methods for destruction.'},
{id:30,cat:'d',trap:0,q:'What does the decimal reduction time (D value) represent?',a:'D value (decimal reduction time) = time required to kill 90% (one log/10-fold reduction) of a microbial population at a specific temperature. If D value = 5 minutes: after 5 min → 90% dead; after 10 min → 99% dead; after 15 min → 99.9% dead (3D reduction).',e:'D value is used to calculate sterilization time. Botulinum spores: D121°C = 0.21 minutes. Food processors use 12D reduction to ensure safety (bot cook): 12 × 0.21 = 2.52 minutes at 121°C. The thermal death point (TDP) = lowest temperature killing all organisms in 10 min. Thermal death time (TDT) = time to kill all organisms at specific temperature. These parameters guide autoclave and pasteurization protocols.'},
{id:31,cat:'b',trap:0,q:'What are oncogenic viruses and how do they cause cancer?',a:'Oncogenic viruses: EBV (Burkitt lymphoma, nasopharyngeal carcinoma), HPV (cervical cancer, head/neck cancer), HBV + HCV (hepatocellular carcinoma), HTLV-1 (adult T-cell leukemia), Kaposi sarcoma herpesvirus (KSHV/HHV-8). Mechanisms: 1. Insertional mutagenesis (disrupt tumor suppressors), 2. Viral oncoproteins (inactivate p53, pRb), 3. Chronic inflammation → DNA damage.',e:'HPV oncoproteins E6 (degrades p53) and E7 (inactivates pRb) → loss of cell cycle control → uncontrolled proliferation. Pap smears detect HPV-induced cervical changes before cancer. Gardasil/Cervarix vaccines target HPV types 16 and 18 (responsible for ~70% of cervical cancers). HBV/HCV vaccines and treatments reduce hepatocellular carcinoma incidence. Vaccines against viruses = cancer prevention.'},
{id:32,cat:'a',trap:0,q:'What criteria are used to classify viruses?',a:'1. Type of nucleic acid (DNA vs RNA) 2. Strandedness (single vs double) 3. Sense (+/-) 4. Presence of envelope 5. Capsid shape (icosahedral, helical, complex) 6. Size 7. Host range 8. Baltimore classification (based on mRNA production strategy)',e:'Baltimore classification system (David Baltimore, Nobel Prize 1975) groups viruses by how they make mRNA: Class I = dsDNA, Class II = ssDNA, Class III = dsRNA, Class IV = + ssRNA, Class V = - ssRNA, Class VI = + ssRNA retroviruses, Class VII = dsDNA retroviruses. This system is useful because mRNA production is the central requirement for viral protein synthesis — the critical step for replication.'},
{id:33,cat:'b',trap:0,q:'What are the steps in animal virus replication from entry to release?',a:'1. Attachment: viral spike binds specific host receptor (specificity determines host range). 2. Penetration: endocytosis or direct membrane fusion. 3. Uncoating: capsid removed, genome released. 4. Replication: genome copied; viral mRNA made; viral proteins synthesized. 5. Assembly: new virions assembled. 6. Release: budding (enveloped) or lysis (naked).',e:'Each step is a potential drug target. Attachment: amantadine blocks influenza M2 channel (uncoating). Entry: enfuvirtide blocks HIV gp41 (fusion). Reverse transcription: NRTIs/NNRTIs (HIV). Integration: integrase inhibitors (HIV). Assembly: protease inhibitors (HIV). Release: oseltamivir/zanamivir block neuraminidase (influenza release). Combination therapy (HAART) targets multiple steps simultaneously.'},
{id:34,cat:'d',trap:0,q:'What features make endospores, Mycobacteria, and prions resistant to germicides?',a:'Endospores: dipicolinic acid + calcium (heat resistance), multilayered coat (chemical barrier), low water content. Mycobacteria: mycolic acid (waxy coat resists many disinfectants, retains acid-fast stain). Prions: no nucleic acid to damage, protease-resistant misfolded protein, resistant to heat/radiation/formaldehyde/UV.',e:'These three are the "most resistant" tier in infection control. Standard disinfection may fail: endospores need glutaraldehyde, bleach, or sterilization. Mycobacteria need intermediate-to-high level disinfection. Prions require 1N NaOH (1 hour) or autoclaving at 134°C for 18 minutes (porous load cycle) — destroy the instrument if in doubt for CJD. This hierarchy guides hospital disinfection protocols.'},
{id:35,cat:'c',trap:0,q:'What study designs and growth media considerations apply to growing anaerobic microbes?',a:'Anaerobic conditions require: anaerobic chamber (glove box with N2/CO2/H2 atmosphere), GasPak jars (consume O2, generate CO2), thioglycollate broth (reduces O2 through the medium — deepest part most anaerobic). Media: reduced media (contain reducing agents — cysteine, thioglycollate). Transport: use pre-reduced transport media for clinical samples.',e:'Many important pathogens are obligate anaerobes: Clostridium tetani (tetanus), C. perfringens (gas gangrene), C. difficile, Bacteroides fragilis (most common anaerobic infection), Fusobacterium. Clinical samples for anaerobic culture must be processed quickly in pre-reduced transport media — oxygen exposure kills obligate anaerobes within minutes. This explains why some infections are culture-negative despite obvious signs.'},
{id:36,cat:'c',trap:1,q:'TRAP: During the stationary phase of bacterial growth, all bacteria stop dividing completely. True or false?',a:'FALSE — in stationary phase, the OVERALL population size is stable (growth rate = death rate) but individual cells continue to divide. New cells are born at the same rate existing cells die — net change is zero, not cessation of all division.',e:'<b>Stationary = growth rate equals death rate, not complete cessation.</b> Nutrient depletion, waste accumulation, and pH change cause the equilibrium. Cells in stationary phase upregulate: stress response genes, secondary metabolite production (many antibiotics are produced in stationary phase by antibiotic-producing bacteria), biofilm formation signals, and sporulation in Bacillus. Understanding stationary phase is critical for industrial fermentation (harvest secondary metabolites at right time).'},
{id:37,cat:'d',trap:0,q:'How does heat control microbial levels and which heat treatments sterilize versus disinfect?',a:'Heat kills by: denaturing proteins (enzymes, structural proteins), disrupting membranes, damaging nucleic acids. Moist heat more effective (penetrates better). Sterilizing: autoclave (121°C, 15 psi, 15 min moist heat). Disinfecting: pasteurization (71°C/15s or 63°C/30 min), boiling (100°C, kills vegetative cells + most viruses, NOT endospores).',e:'Moist heat vs. dry heat: moist heat is more effective because water penetrates and denatures proteins more efficiently. Dry heat requires higher temperatures and longer times (160-170°C for 2-3 hours for sterilization). Autoclave: pressure raises water\'s boiling point to 121°C — essential for endospore destruction. Incineration (burning): absolute sterilization — used for contaminated sharps, biological waste.'},
{id:38,cat:'d',trap:0,q:'How are filtration and radiation used to reduce microbial levels?',a:'Filtration: HEPA filters (0.3 μm — removes most bacteria/spores, not viruses). Membrane filters (0.22 μm — removes bacteria, used to sterilize heat-sensitive liquids). Viral filters (<100 nm). Sterilizing for bacteria: 0.22 μm membrane filtration. Radiation: UV (damages DNA via thymine dimers — disinfection only, poor penetration). Ionizing radiation (gamma, X-ray — sterilizes food, medical devices).',e:'HEPA filters in hospitals (negative pressure isolation rooms for TB) prevent airborne transmission. Ionizing radiation penetrates packaging — used to sterilize pre-packaged medical devices and irradiate food (kills bacteria without heat). UV light is used in air handling and water treatment — limited to surface decontamination (poor penetration through materials or turbid liquids). UV cannot sterilize (cannot reach all surfaces/volumes).'},
{id:39,cat:'c',trap:0,q:'What is the underlying goal of the streak plate method and what information does it provide?',a:'Goal: dilute a mixed sample to achieve ISOLATION of individual cells → form isolated colonies → each colony is a pure culture (clone). Provides: colony morphology (size, shape, color, texture, margin), identifies organisms that can be subcultured and tested biochemically.',e:'The streak plate is the foundation of clinical microbiology — isolating pure cultures from mixed clinical samples (blood, urine, wound). Without pure cultures, you cannot identify organisms or test antibiotic susceptibility. Quadrant method: inoculate first quadrant → drag small amount to second → continue to third and fourth. Each subsequent quadrant has fewer bacteria → isolated colonies in final quadrant. One colony = theoretically one organism.'},
{id:40,cat:'d',trap:0,q:'What do the terms decontamination, sterilization, disinfection, bacteriostatic, and antiseptic mean?',a:'Decontamination: reduce microbial contamination to safe levels (any method). Sterilization: destroy ALL life including endospores. Disinfection: destroy most pathogens on inanimate objects (not endospores usually). Bacteriostatic: inhibits growth without killing. Antiseptic: antimicrobial chemical used on living tissue. Disinfectant: antimicrobial chemical used on inanimate objects.',e:'Key distinctions: Antiseptic (on people — skin, mucous membranes) vs. disinfectant (on surfaces). Same chemical may be used as both at different concentrations — isopropyl alcohol is both. Sterilization = absolute (no viable organisms). Disinfection = reduction of pathogens (some organisms may survive). These terms have regulatory and clinical significance — healthcare facilities must use appropriate level for each situation.'},
{id:41,cat:'b',trap:0,q:'How are bacteriophages and animal viruses grown in the laboratory?',a:'Bacteriophages: mixed with bacterial lawn on agar → plaques form (clear zones where phage lysed bacteria). Animal viruses: grown in: 1. Cell culture (continuous cell lines — Vero, HeLa, HEK293) 2. Embryonated eggs (influenza vaccine production) 3. Animal inoculation (limited use — suckling mice for some arbovirus)',e:'Cell culture allows: propagation, titration (plaque assay), cytopathic effect (CPE) observation — characteristic cell changes caused by viral infection (rounding, syncytia formation, inclusion bodies). HeLa cells (immortal human cervical cancer cells from Henrietta Lacks) have been used in virology since 1951 — polio vaccine development used HeLa cells. Embryonated eggs: influenza still largely produced this way — eggs injected with virus, virus harvested from allantoic fluid.'},
{id:42,cat:'a',trap:1,q:'TRAP: All viruses have both DNA and RNA in their genome. True or false?',a:'FALSE — viruses have EITHER DNA OR RNA as their genetic material, NEVER BOTH (in the genome). DNA viruses have DNA genomes. RNA viruses have RNA genomes. No virus has both as its primary genetic material.',e:'<b>Viruses = either DNA or RNA genome, not both.</b> Some viruses produce RNA from DNA (DNA viruses) or DNA from RNA (retroviruses using reverse transcriptase) as intermediate steps, but the GENOME is one or the other. This is a fundamental characteristic used in viral classification (Baltimore system). Retroviruses have an RNA genome but reverse-transcribe to DNA for integration — their genome is still RNA.'},
{id:43,cat:'c',trap:0,q:'What is the viable plate count method and when is it preferred?',a:'Viable plate count = serial dilution of sample → plated on agar → incubate → count colonies → calculate original concentration (CFU/mL). Best when: viable cell count needed (not dead cells), time is available (24-48 hr incubation), accuracy over speed. Assumption: each colony = one original cell.',e:'Limitations: slow (24-48 hrs), only counts culturable organisms (viable but non-culturable organisms missed), one cell may form one colony (undercount) or multiple may clump (overcount). Direct microscopic count (counting chamber) is faster but counts dead + live cells. Turbidity (spectrophotometry) is fastest but correlates, not measures viability. Each method has specific applications: food safety (viable plate count), environmental monitoring, antibiotic susceptibility testing.'},
{id:44,cat:'a',trap:0,q:'What is meant by host range and tropism for viruses?',a:'Host range: the spectrum of host species a virus can infect (determined by presence of compatible receptors). Tropism: the specific tissues or cell types within a host that a virus preferentially infects (tissue tropism determined by receptor distribution). Example: HIV — host range = humans and some primates; tropism = CD4+ T cells and macrophages.',e:'Receptor specificity determines both. Influenza HA binds sialic acid — human strains prefer α-2,6 linkage (upper respiratory tract), avian strains prefer α-2,3 linkage (lower respiratory tract). Rabies: neurotropic (acetylcholine receptor). Poliovirus: uses PVR receptor — found on motor neurons (explains paralysis). Understanding tropism explains disease symptoms and transmission routes.'},
{id:45,cat:'b',trap:0,q:'What is the difference between viral host range and tropism?',a:'Host range = which SPECIES can be infected (interspecies level — HIV infects humans and chimps, not rodents). Tropism = which CELLS/TISSUES within an infected host are targeted (intrahost level — HIV targets CD4+ T cells, not liver cells). Both determined by receptor compatibility.',e:'A virus can have narrow host range but broad tissue tropism, or vice versa. Rabies has broad host range (any mammal) but narrow tissue tropism (neural tissue). HIV has narrow host range (primates) with specific tissue tropism (CD4+ T cells, macrophages, dendritic cells). Zoonotic viruses (Ebola, SARS, Nipah) normally have animal host range but gain mutations allowing human infection — crossing the species barrier.'},
{id:46,cat:'d',trap:0,q:'Define essential nutrients and growth factors, and compare energy sources for phototrophs vs chemotrophs.',a:'Essential nutrients: required for growth, cannot be synthesized. Macronutrients: C, H, O, N, S, P. Micronutrients (trace elements): Fe, Cu, Zn, Mn. Growth factors: organic molecules required but cannot be synthesized (vitamins, amino acids — required by auxotrophs). Phototrophs: light as energy source. Chemotrophs: chemical compounds as energy source (chemoorganotrophs use organic compounds; chemolithotrophs use inorganic compounds).',e:'Thiamine (B1) is a growth factor for some bacteria that lack thiamine synthesis — they are "thiamine auxotrophs." Understanding nutritional requirements guides selective media formulation. Chemolithotrophs (like Nitrosomonas — oxidizes NH3 to NO2) are critical in nitrogen cycling. Phototrophic bacteria: purple sulfur bacteria, cyanobacteria. Most human pathogens: chemoorganotrophs (like us — use organic compounds for energy).'},
{id:47,cat:'d',trap:1,q:'TRAP: Obligate anaerobes can survive briefly in the presence of oxygen as long as they are not actively growing. True or false?',a:'FALSE — obligate anaerobes are KILLED by oxygen regardless of growth status. Even resting (non-growing) obligate anaerobes die in the presence of oxygen because they lack superoxide dismutase and catalase to neutralize toxic oxygen radicals.',e:'<b>Obligate anaerobes = killed by O2 even when not growing.</b> They cannot neutralize superoxide or H2O2 produced by oxygen reactions. The only protection is complete anaerobic conditions. This is why clinical anaerobic cultures must use pre-reduced transport media and be processed immediately — even brief O2 exposure kills obligate anaerobes and gives false-negative cultures.'},
{id:48,cat:'d',trap:0,q:'What are the various classes of germicides and what factors go into selecting the right one?',a:'Classes: alcohols (intermediate), chlorine compounds (low to high), iodine/iodophors (intermediate), quaternary ammonium (low-intermediate), glutaraldehyde (high), hydrogen peroxide (intermediate-high), peracetic acid (high/sterilizing). Selection factors: type of organism (endospores?), equipment material compatibility, contact time, cost, toxicity, regulatory approval.',e:'No single germicide is best for all situations. Glutaraldehyde (Cidex): high-level disinfectant/sterilant for endoscopes — 8-10 hour contact time for sterilization. Bleach (sodium hypochlorite): excellent for C. diff (destroys endospores), blood spills. Quaternary ammonium (quats): good for environmental surfaces, ineffective against non-enveloped viruses and M. tuberculosis. Isopropyl alcohol 70%: excellent for skin prep, instruments — but not endospores.'},
{id:49,cat:'c',trap:0,q:'What is generation time and how does it impact treatment decisions?',a:'Generation time = time for a bacterial population to double. Clinical impact: fast-growing bacteria (S. aureus, 20-30 min) respond quickly to antibiotics. Slow-growing bacteria (M. tuberculosis, 12-24 hr) require months of treatment. Dormant bacteria (persisters) may not be killed by antibiotics targeting actively growing cells.',e:'Antibiotic dosing schedules are based partly on bacterial generation time. Beta-lactams are time-dependent (maintain concentration above MIC throughout dosing interval — dosing frequency matters). Aminoglycosides are concentration-dependent (peak concentration matters — once daily dosing effective). M. tuberculosis treatment requires 6+ months to ensure all slow-growing and dormant bacteria are killed — shorter treatment leads to relapse and resistance.'},
{id:50,cat:'d',trap:0,q:'How does filtration sterilize heat-sensitive liquids and what is the pore size required?',a:'Membrane filtration (0.22 μm pore size) removes bacteria and most fungi (unable to pass through pores) from liquids that cannot be autoclaved (antibiotics, serum, vitamins, some biologics). Does NOT remove viruses (too small) or prions. Depth filters have larger pores — remove larger particles. HEPA filters use 0.3 μm to capture airborne microorganisms.',e:'Filtration-sterilized liquids: cell culture media (serum cannot be autoclaved — proteins denature), antibiotic solutions, vaccines. 0.22 μm is the standard "sterilizing grade" filter. Viruses (20-300 nm = 0.02-0.3 μm) can pass through 0.22 μm filters — separate viral filtration steps needed for blood products to prevent HIV, HCV transmission. Prions are proteins (~30 nm) and cannot be removed by filtration — must be inactivated chemically.'},
];
let ans={};let cf='all';
function render(){
  const fl=cf==='all'?Q:cf==='t'?Q.filter(q=>q.trap):Q.filter(q=>q.cat===cf);
  const g=document.getElementById('grid');g.innerHTML='';
  fl.forEach(q=>{
    const tc=q.cat==='a'?'ta':q.cat==='b'?'tb':q.cat==='c'?'tc':q.cat==='d'?'td':'tt';
    const tl=q.cat==='a'?'Virus Structure':q.cat==='b'?'Viral Replication':q.cat==='c'?'Microbial Growth':q.cat==='d'?'Environmental':'Exam Trap';
    const d=document.createElement('div');d.className='qcard';
    d.innerHTML=`<div class="qh"><span class="qn">Q${String(q.id).padStart(2,'0')}</span><div class="qt">${q.q}${q.trap?'<span class="trap-pill">⚠ Trap</span>':''}</div><span class="qtag ${tc}">${tl}</span></div><div class="qans"><div class="al">Answer</div><div class="at">${q.a}</div></div><div class="qexp"><div class="el">Why it matters</div><div class="et">${q.e}</div></div>`;
    g.appendChild(d);
  });
  document.getElementById('sr').textContent=50-Object.keys(ans).length;
}
function filt(c,btn){cf=c;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function resetAll(){ans={};render();}
render();
</script>
